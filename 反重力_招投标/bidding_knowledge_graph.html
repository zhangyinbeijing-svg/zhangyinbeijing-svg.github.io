    // -------------------------------------------------------------
    // 2. Physics & Interactive Canvas Setup
    // -------------------------------------------------------------
    const canvas = document.getElementById("graphCanvas");
    const container = document.getElementById("canvasContainer");
    const ctx = canvas.getContext("2d");

    let width = 1000;
    let height = 650;
    let dpr = window.devicePixelRatio || 1;

    let transform = { x: 0, y: 0, scale: 1 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let draggedNode = null;
    let hoveredNode = null;
    let selectedNode = null;

    let activeCategories = new Set(Object.keys(CATEGORIES));
    let searchQuery = "";
    let activePreset = "all";
    let isSpaciousMode = true; // 默认疏朗模式，保证绝不重叠

    let nodes = [];
    let links = [];

    function initGraphData() {
      let procIndex = 0;
      let decIndex = 0;
      nodes = RAW_NODES.map((n, i) => {
        const center = CATEGORY_CENTERS[n.category] || { x: 0.5, y: 0.5 };
        let initX, initY;
        if (n.category === "process") {
          // 流程节点沿中轴按生命周期时序平滑纵向轻微交错分布
          const progress = procIndex / 12.5;
          initX = width * (0.46 + (procIndex % 2 === 0 ? -0.04 : 0.04));
          initY = height * (0.12 + progress * 0.76);
          procIndex++;
        } else if (n.category === "bid_decision") {
          // 投标决策节点在左上方自然扇形舒展分布
          const progress = decIndex / 5;
          initX = width * (0.12 + (decIndex % 2 === 0 ? -0.03 : 0.05));
          initY = height * (0.12 + progress * 0.28);
          decIndex++;
        } else {
          const angle = (i * 1.37) % (Math.PI * 2);
          const dist = 30 + ((i * 31) % 95);
          initX = center.x * width + Math.cos(angle) * dist;
          initY = center.y * height + Math.sin(angle) * dist;
        }
        return {
          ...n,
          x: initX,
          y: initY,
          vx: 0,
          vy: 0,
          radius: 17 + (n.importance || 1) * 6
        };
      });

      const nodeMap = new Map(nodes.map(n => [n.id, n]));
      links = RAW_LINKS.map(l => ({
        ...l,
        sourceNode: nodeMap.get(l.source),
        targetNode: nodeMap.get(l.target)
      })).filter(l => l.sourceNode && l.targetNode);

      for (let s = 0; s < 45; s++) {
        updatePhysics();
      }

      updateStats();
      fitView();
    }

    function resize() {
      const rect = container.getBoundingClientRect();
      width = Math.max(rect.width, 300);
      height = Math.max(rect.height, 200);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    // 核心物理引擎：含硬碰撞防重叠与阻尼控制
    function updatePhysics() {
      const visibleNodes = getVisibleNodes();
      const visibleNodeSet = new Set(visibleNodes);
      const visibleLinks = links.filter(l => visibleNodeSet.has(l.sourceNode) && visibleNodeSet.has(l.targetNode));

      const extraSpacing = isSpaciousMode ? 70 : 45;
      const defaultLength = isSpaciousMode ? 135 : 105;

      // 1. 软化反比平方斥力
      for (let i = 0; i < visibleNodes.length; i++) {
        const a = visibleNodes[i];
        for (let j = i + 1; j < visibleNodes.length; j++) {
          const b = visibleNodes[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distSq = dx * dx + dy * dy + 450;
          const dist = Math.sqrt(distSq);

          const force = (4200 * (a.importance || 1) * (b.importance || 1)) / distSq;
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;

          if (a !== draggedNode) {
            a.vx -= fx;
            a.vy -= fy;
          }
          if (b !== draggedNode) {
            b.vx += fx;
            b.vy += fy;
          }
        }
      }

      // 2. 关键优化：物理硬碰撞分离（保证任何两节点距离 >= 节点半径 + 标签文字安全盒尺寸）
      for (let i = 0; i < visibleNodes.length; i++) {
        const a = visibleNodes[i];
        for (let j = i + 1; j < visibleNodes.length; j++) {
          const b = visibleNodes[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const minDist = a.radius + b.radius + extraSpacing; // 严格维持两圆心距离在 100~130px 之间

          if (dist < minDist) {
            const overlap = (minDist - dist) * 0.45;
            const nx = dx / dist;
            const ny = dy / dist;

            if (a !== draggedNode) {
              a.x -= nx * overlap;
              a.y -= ny * overlap;
              a.vx -= nx * overlap * 0.15;
              a.vy -= ny * overlap * 0.15;
            }
            if (b !== draggedNode) {
              b.x += nx * overlap;
              b.y += ny * overlap;
              b.vx += nx * overlap * 0.15;
              b.vy += ny * overlap * 0.15;
            }
          }
        }
      }

      // 3. 弹簧引力
      for (const l of visibleLinks) {
        const a = l.sourceNode;
        const b = l.targetNode;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const diff = dist - defaultLength;
        const force = diff * 0.022;

        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;

        if (a !== draggedNode) {
          a.vx += fx;
          a.vy += fy;
        }
        if (b !== draggedNode) {
          b.vx -= fx;
          b.vy -= fy;
        }
      }

      // 4. 分类分区锚定引力与阻尼
      for (const n of visibleNodes) {
        if (n === draggedNode) continue;
        const center = CATEGORY_CENTERS[n.category] || { x: 0.5, y: 0.5 };
        n.vx += (center.x * width - n.x) * 0.007;
        n.vy += (center.y * height - n.y) * 0.007;

        n.vx *= 0.82;
        n.vy *= 0.82;

        n.vx = Math.max(-4.5, Math.min(4.5, n.vx));
        n.vy = Math.max(-4.5, Math.min(4.5, n.vy));

        n.x += n.vx;
        n.y += n.vy;

        n.x = Math.max(n.radius + 20, Math.min(width - n.radius - 20, n.x));
        n.y = Math.max(n.radius + 20, Math.min(height - n.radius - 20, n.y));
      }
    }

    function render() {
      ctx.save();
      ctx.clearRect(0, 0, width, height);

      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.scale, transform.scale);

      const visibleNodes = getVisibleNodes();
      const visibleNodeSet = new Set(visibleNodes);
      const visibleLinks = links.filter(l => visibleNodeSet.has(l.sourceNode) && visibleNodeSet.has(l.targetNode));

      // 1. 绘制连线
      for (const l of visibleLinks) {
        const isHighlighted = (selectedNode && (l.sourceNode === selectedNode || l.targetNode === selectedNode)) ||
                              (hoveredNode && (l.sourceNode === hoveredNode || l.targetNode === hoveredNode));

        ctx.beginPath();
        ctx.moveTo(l.sourceNode.x, l.sourceNode.y);
        ctx.lineTo(l.targetNode.x, l.targetNode.y);

        if (isHighlighted) {
          ctx.strokeStyle = "#c084fc";
          ctx.lineWidth = 2.4;
        } else {
          ctx.strokeStyle = "rgba(71, 85, 105, 0.45)";
          ctx.lineWidth = 1.1;
        }
        ctx.stroke();

        if (isHighlighted || transform.scale > 0.85) {
          const midX = (l.sourceNode.x + l.targetNode.x) / 2;
          const midY = (l.sourceNode.y + l.targetNode.y) / 2;
          ctx.font = "10px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const textMetrics = ctx.measureText(l.label);
          ctx.fillStyle = "rgba(11, 17, 32, 0.9)";
          ctx.fillRect(midX - textMetrics.width / 2 - 3, midY - 7, textMetrics.width + 6, 14);

          ctx.fillStyle = isHighlighted ? "#f8fafc" : "#94a3b8";
          ctx.fillText(l.label, midX, midY);
        }
      }

      // 2. 排序：普通节点先绘制，选中或悬浮的节点最后绘制（最高 Z-Index，防止被盖住）
      const sortedNodes = [...visibleNodes].sort((a, b) => {
        if (a === selectedNode || a === hoveredNode) return 1;
        if (b === selectedNode || b === hoveredNode) return -1;
        return 0;
      });

      // 3. 绘制实体圆点与防重叠胶囊标签
      for (const n of sortedNodes) {
        const cat = CATEGORIES[n.category] || { color: "#94a3b8", border: "#64748b" };
        const isHovered = n === hoveredNode;
        const isSelected = n === selectedNode;
        const isMatchedSearch = searchQuery && (n.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                               (n.condition && n.condition.toLowerCase().includes(searchQuery.toLowerCase())) ||
                               (n.scenario && n.scenario.toLowerCase().includes(searchQuery.toLowerCase())));

        // 实体外圈发光光晕
        if (isHovered || isSelected || isMatchedSearch) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = isMatchedSearch ? "rgba(234, 179, 8, 0.35)" : "rgba(192, 132, 252, 0.35)";
          ctx.fill();
        }

        // 实体主圆形
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = cat.color;
        ctx.fill();
        ctx.lineWidth = isSelected ? 3.5 : 2;
        ctx.strokeStyle = isSelected ? "#ffffff" : cat.border;
        ctx.stroke();

        // 核心优化：双行智能防重叠胶囊文字排布
        const lines = n.shortLines || [n.name];
        ctx.font = `${isSelected ? "bold " : ""}10px sans-serif`;
        const lineHeight = 13;
        
        let maxTextW = 0;
        lines.forEach(line => {
          const w = ctx.measureText(line).width;
          if (w > maxTextW) maxTextW = w;
        });

        const pillW = Math.max(maxTextW + 10, 48);
        const pillH = lines.length * lineHeight + 5;
        const pillX = n.x - pillW / 2;
        const pillY = n.y + n.radius + 3;

        // 绘制半透明保护胶囊背景底色（彻底遮盖下方杂乱连线，杜绝视觉叠色）
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(pillX, pillY, pillW, pillH, 5);
        } else {
          ctx.rect(pillX, pillY, pillW, pillH);
        }
        ctx.fillStyle = isSelected ? "rgba(30, 41, 59, 0.96)" : (isHovered ? "rgba(15, 23, 42, 0.95)" : "rgba(15, 23, 42, 0.86)");
        ctx.fill();
        ctx.lineWidth = isSelected ? 1.5 : 1;
        ctx.strokeStyle = isSelected ? "#c084fc" : (isHovered ? "#94a3b8" : "rgba(71, 85, 105, 0.35)");
        ctx.stroke();

        // 绘制文字
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        lines.forEach((line, idx) => {
          ctx.fillStyle = isSelected ? "#ffffff" : (isHovered ? "#f1f5f9" : "#cbd5e1");
          ctx.fillText(line, n.x, pillY + 3 + idx * lineHeight);
        });
      }

      ctx.restore();
    }

    function animate() {
      updatePhysics();
      render();
      requestAnimationFrame(animate);
    }

    // -------------------------------------------------------------
    // 3. Preset & Category Filters
    // -------------------------------------------------------------
    const PRESET_CATEGORIES = {
      all: Object.keys(CATEGORIES),
      bid_decision_matrix: ["bid_decision", "subject", "document", "process", "eval_method"],
      process_lifecycle: ["process", "document", "law_remedy", "subject"],
      law_system: ["law_remedy", "risk_control", "procure_mode"],
      procure_modes: ["procure_mode", "eval_method", "subject", "law_remedy"],
      risk_control: ["risk_control", "law_remedy", "subject", "document"],
      rules_remedy: ["law_remedy", "risk_control", "process"],
      eval_finance: ["eval_method", "document", "process", "subject"]
    };

    function getVisibleNodes() {
      const allowedCategories = PRESET_CATEGORIES[activePreset] || Object.keys(CATEGORIES);
      return nodes.filter(n => {
        if (!allowedCategories.includes(n.category)) return false;
        if (!activeCategories.has(n.category)) return false;
        return true;
      });
    }

    function updateStats() {
      const vNodes = getVisibleNodes();
      const vNodeSet = new Set(vNodes);
      const vLinks = links.filter(l => vNodeSet.has(l.sourceNode) && vNodeSet.has(l.targetNode));
      document.getElementById("graphStats").textContent = `可见实体: ${vNodes.length} | 关联路径: ${vLinks.length}`;
    }

    function fitView() {
      const visible = getVisibleNodes();
      if (visible.length === 0) {
        transform = { x: 0, y: 0, scale: 1 };
        return;
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const n of visible) {
        minX = Math.min(minX, n.x - n.radius - 35);
        maxX = Math.max(maxX, n.x + n.radius + 35);
        minY = Math.min(minY, n.y - n.radius - 15);
        maxY = Math.max(maxY, n.y + n.radius + 35);
      }

      const padding = 55;
      const graphW = Math.max((maxX - minX) + padding * 2, 100);
      const graphH = Math.max((maxY - minY) + padding * 2, 100);

      const scale = Math.min(1.15, Math.max(0.42, Math.min(width / graphW, height / graphH)));
      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      transform.scale = scale;
      transform.x = (width / 2) - midX * scale;
      transform.y = (height / 2) - midY * scale;
    }

    // -------------------------------------------------------------
    // 4. Detailed Drawer Rendering
    // -------------------------------------------------------------
    const drawer = document.getElementById("nodeDrawer");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerBadge = document.getElementById("drawerBadge");
    const drawerLegalLevel = document.getElementById("drawerLegalLevel");
    const drawerDesc = document.getElementById("drawerDesc");
    const drawerScenario = document.getElementById("drawerScenario");
    const drawerCondition = document.getElementById("drawerCondition");
    const drawerAttributes = document.getElementById("drawerAttributes");
    const drawerRisks = document.getElementById("drawerRisks");
    const drawerRelations = document.getElementById("drawerRelations");
    const relationCount = document.getElementById("relationCount");

    function openDrawer(node) {
      const cat = CATEGORIES[node.category];
      drawerBadge.textContent = cat.name;
      drawerBadge.style.backgroundColor = cat.bg;
      drawerBadge.style.color = cat.color;
      drawerBadge.style.border = `1px solid ${cat.border}`;

      drawerTitle.textContent = node.name;
      drawerDesc.textContent = node.desc || "暂无具体定义说明。";

      if (node.legalLevel) {
        drawerLegalLevel.innerText = node.legalLevel;
        document.getElementById("drawerLegalLevelSection").style.display = "block";
      } else {
        document.getElementById("drawerLegalLevelSection").style.display = "none";
      }

      if (node.scenario) {
        drawerScenario.innerText = node.scenario;
        document.getElementById("drawerScenarioSection").style.display = "block";
      } else {
        document.getElementById("drawerScenarioSection").style.display = "none";
      }

      if (node.condition) {
        drawerCondition.innerText = node.condition;
        document.getElementById("drawerConditionSection").style.display = "block";
      } else {
        document.getElementById("drawerConditionSection").style.display = "none";
      }

      drawerAttributes.innerHTML = "";
      if (node.attrs && node.attrs.length > 0) {
        node.attrs.forEach(attr => {
          const item = document.createElement("div");
          item.className = "flex items-center gap-2 text-slate-300 font-medium";
          item.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span><span>${attr}</span>`;
          drawerAttributes.appendChild(item);
        });
        document.getElementById("drawerAttributesSection").style.display = "block";
      } else {
        document.getElementById("drawerAttributesSection").style.display = "none";
      }

      if (node.risks) {
        drawerRisks.textContent = node.risks;
        document.getElementById("drawerRiskSection").style.display = "block";
      } else {
        document.getElementById("drawerRiskSection").style.display = "none";
      }

      drawerRelations.innerHTML = "";
      const relatedLinks = links.filter(l => l.sourceNode === node || l.targetNode === node);
      relationCount.textContent = relatedLinks.length;

      relatedLinks.forEach(l => {
        const isOutgoing = l.sourceNode === node;
        const otherNode = isOutgoing ? l.targetNode : l.sourceNode;
        const otherCat = CATEGORIES[otherNode.category];

        const row = document.createElement("div");
        row.className = "p-2 rounded-lg bg-slate-950/70 border border-slate-800 flex items-center justify-between cursor-pointer hover:border-purple-500/50 transition";
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-[10px] px-1.5 py-0.5 rounded text-slate-300 ${isOutgoing ? 'bg-purple-950 border border-purple-700/50' : 'bg-amber-950 border border-amber-700/50'}">
              ${isOutgoing ? '指出' : '指入'} · ${l.label}
            </span>
            <span class="font-medium text-slate-200">${otherNode.name}</span>
          </div>
          <span class="text-[10px] px-1.5 py-0.5 rounded" style="color: ${otherCat.color}; background: ${otherCat.bg}">${otherCat.name}</span>
        `;
        row.addEventListener("click", () => {
          selectedNode = otherNode;
          openDrawer(otherNode);
        });
        drawerRelations.appendChild(row);
      });

      drawer.classList.remove("translate-x-full");
    }

    document.getElementById("closeDrawerBtn").addEventListener("click", () => {
      drawer.classList.add("translate-x-full");
      selectedNode = null;
    });

    // -------------------------------------------------------------
    // 5. Interactions & Events
    // -------------------------------------------------------------
    function screenToWorld(sx, sy) {
      return {
        x: (sx - transform.x) / transform.scale,
        y: (sy - transform.y) / transform.scale
      };
    }

    function findNodeAt(worldX, worldY) {
      const visible = getVisibleNodes();
      for (let i = visible.length - 1; i >= 0; i--) {
        const n = visible[i];
        const dx = worldX - n.x;
        const dy = worldY - n.y;
        // 包含圆点与下方胶囊范围内的点击判定
        if (dx * dx + dy * dy <= (n.radius + 6) * (n.radius + 6)) {
          return n;
        }
        if (Math.abs(dx) <= 35 && dy >= n.radius && dy <= n.radius + 35) {
          return n;
        }
      }
      return null;
    }

    canvas.addEventListener("mousedown", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const world = screenToWorld(sx, sy);
      const hit = findNodeAt(world.x, world.y);

      if (hit) {
        draggedNode = hit;
        selectedNode = hit;
        openDrawer(hit);
      } else {
        isDragging = true;
        dragStart = { x: sx - transform.x, y: sy - transform.y };
      }
    });

    window.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;

      if (draggedNode) {
        const world = screenToWorld(sx, sy);
        draggedNode.x = world.x;
        draggedNode.y = world.y;
        draggedNode.vx = 0;
        draggedNode.vy = 0;
      } else if (isDragging) {
        transform.x = sx - dragStart.x;
        transform.y = sy - dragStart.y;
      } else {
        const world = screenToWorld(sx, sy);
        hoveredNode = findNodeAt(world.x, world.y);
        canvas.style.cursor = hoveredNode ? "pointer" : "grab";
      }
    });

    window.addEventListener("mouseup", () => {
      draggedNode = null;
      isDragging = false;
    });

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;

      const newScale = Math.max(0.3, Math.min(3.0, transform.scale * zoomFactor));
      transform.x = sx - (sx - transform.x) * (newScale / transform.scale);
      transform.y = sy - (sy - transform.y) * (newScale / transform.scale);
      transform.scale = newScale;
    });

    function renderCategoryToggles() {
      const container = document.getElementById("categoryFilterContainer");
      container.innerHTML = "";

      Object.entries(CATEGORIES).forEach(([key, cat]) => {
        const count = RAW_NODES.filter(n => n.category === key).length;
        const btn = document.createElement("button");
        btn.className = `px-2.5 py-1 rounded-full text-xs font-medium border flex items-center gap-1.5 transition ${
          activeCategories.has(key) ? "opacity-100" : "opacity-40 grayscale"
        }`;
        btn.style.backgroundColor = cat.bg;
        btn.style.borderColor = cat.border;
        btn.style.color = cat.color;
        btn.innerHTML = `<span class="w-2 h-2 rounded-full" style="background-color: ${cat.color}"></span><span>${cat.name}</span><span class="text-[10px] opacity-75">(${count})</span>`;

        btn.addEventListener("click", () => {
          if (activeCategories.has(key)) {
            if (activeCategories.size > 1) activeCategories.delete(key);
          } else {
            activeCategories.add(key);
          }
          btn.className = `px-2.5 py-1 rounded-full text-xs font-medium border flex items-center gap-1.5 transition ${
            activeCategories.has(key) ? "opacity-100" : "opacity-40 grayscale"
          }`;
          updateStats();
        });

        container.appendChild(btn);
      });
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      if (searchQuery) {
        const match = nodes.find(n => 
          n.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
          (n.condition && n.condition.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (n.scenario && n.scenario.toLowerCase().includes(searchQuery.toLowerCase()))
        );
        if (match) {
          selectedNode = match;
          openDrawer(match);
        }
      }
    });

    document.getElementById("viewPreset").addEventListener("change", e => {
      activePreset = e.target.value;
      const allowed = PRESET_CATEGORIES[activePreset] || Object.keys(CATEGORIES);
      activeCategories = new Set(allowed);
      renderCategoryToggles();
      updateStats();
      fitView();
    });

    // 疏朗/紧凑间距交互切换
    document.getElementById("spacingToggleBtn").addEventListener("click", () => {
      isSpaciousMode = !isSpaciousMode;
      document.getElementById("spacingLabel").textContent = isSpaciousMode ? "疏朗间距" : "紧凑间距";
      // 触发展开迭代
      for (let s = 0; s < 25; s++) {
        updatePhysics();
      }
      fitView();
    });

    document.getElementById("resetViewBtn").addEventListener("click", fitView);
    document.getElementById("fitViewBtn").addEventListener("click", fitView);
    document.getElementById("exportImageBtn").addEventListener("click", () => {
      try {
        const link = document.createElement("a");
        link.download = "招投标与政府采购全景知识图谱.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        console.error("导出图片失败:", err);
      }
    });
    document.getElementById("zoomInBtn").addEventListener("click", () => {
      transform.scale = Math.min(3.0, transform.scale * 1.25);
    });
    document.getElementById("zoomOutBtn").addEventListener("click", () => {
      transform.scale = Math.max(0.3, transform.scale * 0.8);
    });

    const resizeObserver = new ResizeObserver(() => {
      resize();
      fitView();
    });
    resizeObserver.observe(container);

    resize();
    initGraphData();
    renderCategoryToggles();
    animate();
  </script>
</body>
</html>
