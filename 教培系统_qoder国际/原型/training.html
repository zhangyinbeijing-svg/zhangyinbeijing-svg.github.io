<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训管理 · 干部培训学院教务管理系统 原型 V1.0</title>
<style>
:root{--primary:#1F4E79;--primary-2:#2E75B6;--success:#2E7D32;--warning:#F57F17;--danger:#C62828;
 --text:#333;--text-2:#595959;--text-3:#8a9099;--bg:#F5F6F8;--card:#fff;--line:#e5e8ec;
 --topbar-h:56px;--nav-w:220px;--nav-w-c:64px;--r:4px;--r-card:8px;--r-modal:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{text-decoration:none;color:var(--primary-2);cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:4px}
.btn{height:32px;padding:0 16px;border-radius:var(--r);font-size:14px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#173e61}
.btn-primary[disabled]{background:#b9c4d0;cursor:not-allowed}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text-2)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-text{background:none;border:none;color:var(--primary-2);cursor:pointer;font-size:13px;padding:0 4px}
.btn-text:hover{text-decoration:underline}
.btn-text.danger{color:var(--danger)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.tag-blue{background:rgba(46,117,182,.12);color:var(--primary-2)}
.tag-green{background:rgba(46,125,50,.12);color:var(--success)}
.tag-orange{background:rgba(247,127,23,.12);color:var(--warning)}
.tag-red{background:rgba(198,40,40,.12);color:var(--danger)}
.tag-gray{background:rgba(89,95,105,.1);color:var(--text-2)}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-body{padding:16px}
.input,.sel{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.input:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,121,.12)}
/* 顶部栏/导航（同框架） */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tb-logo{display:flex;align-items:center;gap:10px;min-width:230px}
.tb-logo .mark{width:32px;height:32px;border-radius:6px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tb-logo .name{font-size:16px;font-weight:700;white-space:nowrap}
.tb-search{flex:1;max-width:460px}.tb-search .input{width:100%;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;height:34px}
.tb-search .input::placeholder{color:rgba(255,255,255,.6)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-icon{position:relative;width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.tb-icon:hover{background:rgba(255,255,255,.15)}
.tb-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-ver{font-size:12px;color:rgba(255,255,255,.65);margin:0 4px}
.tb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.tb-user:hover{background:rgba(255,255,255,.15)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.sidenav{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:90;transition:width .2s}
.nav-parent{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;cursor:pointer;color:var(--text-2);font-size:14px;position:relative}
.nav-parent:hover{background:#f2f6fa;color:var(--primary)}
.nav-icon{width:18px;text-align:center;font-size:15px;flex:none}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-caret{font-size:11px;color:var(--text-3);transition:transform .2s}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-group.open>.nav-parent{color:var(--primary);font-weight:700}
.nav-children{display:none;background:#fafbfc}
.nav-group.open .nav-children{display:block}
.nav-child{padding:0 16px 0 44px;height:36px;display:flex;align-items:center;font-size:13px;color:var(--text-2);cursor:pointer;position:relative}
.nav-child:hover{color:var(--primary);background:#f2f6fa}
.nav-child.active{color:var(--primary);font-weight:700;background:rgba(31,78,121,.08)}
.nav-child.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.nav-collapse{border-top:1px solid var(--line);padding:12px 16px;font-size:13px;color:var(--text-3);cursor:pointer;display:flex;gap:8px;align-items:center}
body.nav-collapsed .sidenav{width:var(--nav-w-c)}
body.nav-collapsed .nav-label,body.nav-collapsed .nav-caret,body.nav-collapsed .nav-children,body.nav-collapsed .nav-collapse span{display:none}
body.nav-collapsed .nav-parent{justify-content:center;padding:0}
body.nav-collapsed .nav-collapse{justify-content:center}
.content{margin-left:var(--nav-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h));transition:margin-left .2s}
body.nav-collapsed .content{margin-left:var(--nav-w-c)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:6px}
.page-title{font-size:20px;font-weight:700}
.page-ops{display:flex;gap:8px}
/* 筛选/表格 */
.filter-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.f-item label{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px}
.f-item .input,.f-item .sel{width:100%}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th,.data-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table th{background:#fafbfc;color:var(--text-2);font-size:12px;font-weight:400}
.data-table tbody tr:hover{background:#f7fafd}
.data-table .c-name{font-weight:700;color:var(--primary);cursor:pointer}
.data-table .c-name:hover{text-decoration:underline}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:14px;font-size:13px;color:var(--text-3)}
.pager .pg{min-width:28px;height:28px;border:1px solid var(--line);border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.pager .pg.cur{background:var(--primary);color:#fff;border-color:var(--primary)}
.score-high{color:var(--success);font-weight:700}.score-low{color:var(--danger);font-weight:700}
.money-over{color:var(--danger);font-weight:700}
/* 详情头/Tab */
.detail-head{background:linear-gradient(120deg,var(--primary),var(--primary-2));border-radius:var(--r-card);color:#fff;padding:18px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow)}
.detail-head h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.detail-head .meta{font-size:12px;opacity:.85;margin-top:6px}
.detail-head .ops{margin-left:auto;display:flex;gap:8px}
.detail-head .btn-ghost{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.stat-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat{background:#f7f9fc;border-radius:var(--r);padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:700;font-family:Consolas,monospace;color:var(--primary)}
.stat .n.red{color:var(--danger)}.stat .n.green{color:var(--success)}.stat .n.orange{color:var(--warning)}
.stat .l{font-size:12px;color:var(--text-3);margin-top:2px}
.t-ops{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.t-ops .right{margin-left:auto;font-size:12px;color:var(--text-3)}
.alert{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.alert-red{background:rgba(198,40,40,.08);color:var(--danger);border:1px solid rgba(198,40,40,.25)}
.alert-green{background:rgba(46,125,50,.08);color:var(--success);border:1px solid rgba(46,125,50,.25)}
.bar-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.bar-row .nm{width:200px;flex:none}
.bar{flex:1;height:8px;background:#eef1f4;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--success)}
.bar.mid i{background:var(--primary-2)}.bar.low i{background:var(--danger)}
.bar-row .sc{width:48px;text-align:right;font-weight:700;font-family:Consolas,monospace}
/* 向导 */
.steps{display:flex;margin-bottom:20px}
.step{flex:1;text-align:center;font-size:13px;color:var(--text-3);position:relative;padding-top:30px}
.step::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#e9edf2;color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:12px}
.step::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:#e9edf2}
.step:last-child::after{display:none}
.step.cur{color:var(--primary);font-weight:700}
.step.cur::before{background:var(--primary);color:#fff}
.step.done::before{background:var(--success);color:#fff;content:"✓"}
.wz-course{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer;font-size:13px}
.wz-course:hover{border-color:var(--primary-2)}
.wz-course .hrs{margin-left:auto;color:var(--text-3);font-size:12px}
.wz-sum{background:#f7f9fc;border-radius:var(--r);padding:14px;font-size:13px;line-height:2}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{width:680px;max-height:88vh;background:#fff;border-radius:var(--r-modal);box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:14px 18px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.f-row label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.f-row label .req{color:var(--danger);margin-right:2px}
.f-row .input,.f-row .sel{width:100%}
.f-row.full{grid-column:1/3}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.switch{position:relative;width:40px;height:22px;background:#c9d2dc;border-radius:999px;cursor:pointer;transition:background .2s;flex:none;display:inline-block;vertical-align:middle}
.switch.on{background:var(--success)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on::after{left:20px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(40,45,52,.92);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:300;box-shadow:var(--shadow)}
.mini-note{font-size:12px;color:var(--text-3);margin-top:8px}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-logo"><div class="mark">院</div><div class="name">干部培训学院教务管理系统</div></div>
  <div class="tb-search"><input class="input" id="tbSearch" placeholder="🔍 全局搜索：班次 / 学员 / 师资 / 课程…"></div>
  <div class="tb-right">
    <span class="tb-ver">V1.0 原型</span>
    <div class="tb-icon" onclick="toast('跳转消息中心（原型占位）')" title="站内信">🔔<span class="tb-badge">5</span></div>
    <div class="tb-icon" onclick="toast('帮助中心为原型占位')" title="帮助中心">❓</div>
    <div class="tb-user" id="tbUser"><div class="tb-avatar">张</div><span>张三</span><span style="font-size:10px">▼</span></div>
  </div>
</header>

<aside class="sidenav" id="sidenav"></aside>

<main class="content">
  <!-- ===== 培训班列表（4.3-P01） ===== -->
  <section id="page-list">
    <div class="page-head">
      <div><div class="breadcrumb">首页 / 培训管理 / 培训班管理</div><h2 class="page-title">培训班管理</h2></div>
      <div class="page-ops">
        <button class="btn btn-ghost" onclick="toast('导出班次清单（原型占位）')">导出</button>
        <button class="btn btn-ghost" onclick="toast('模板下载+文件上传+校验预览（原型占位）')">导入</button>
        <button class="btn btn-primary" onclick="openWizard()">＋ 新建班次</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px"><div class="card-body">
      <div class="filter-bar">
        <div class="f-item"><label>班次名称</label><input class="input" id="fName" placeholder="模糊搜索" oninput="renderList()"></div>
        <div class="f-item"><label>培训类别</label><select class="sel" id="fCat" onchange="renderList()"><option value="">全部</option><option>党校班</option><option>政能班</option><option>专题研讨班</option><option>任职培训班</option></select></div>
        <div class="f-item"><label>主办单位</label><select class="sel" id="fHost" onchange="renderList()"><option value="">全部</option><option>办公厅</option><option>干部司</option><option>机关党委</option></select></div>
        <div class="f-item"><label>班次状态</label><select class="sel" id="fStatus" onchange="renderList()"><option value="">全部</option><option>筹备</option><option>在办</option><option>待结班</option><option>已结业</option></select></div>
        <div class="f-item"><label>开始日期（≥）</label><input class="input" id="fDate" type="date" onchange="renderList()"></div>
      </div>
    </div></div>
    <div class="card"><div class="card-body">
      <table class="data-table">
        <thead><tr><th>班次名称</th><th>培训类别</th><th>培训对象</th><th>主办/承办</th><th>时长</th><th>起止日期</th><th>学员数</th><th>进度</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
      <div class="pager"><span id="pgTotal"></span><span class="pg">‹</span><span class="pg cur">1</span><span class="pg">›</span></div>
    </div></div>
  </section>

  <!-- ===== 班次详情（4.3-P02） ===== -->
  <section id="page-detail" class="hidden">
    <div class="detail-head">
      <div>
        <h2 id="dtName">班次详情</h2>
        <div class="meta" id="dtMeta"></div>
      </div>
      <div class="ops">
        <button class="btn btn-ghost" onclick="goList()">‹ 返回列表</button>
        <button class="btn btn-ghost" onclick="location.href='training-schedule.html?class='+curClass">🧲 拖拽排课</button>
        <button class="btn btn-ghost" onclick="switchTab('budget')">💰 预算</button>
        <button class="btn btn-ghost" onclick="switchTab('report')">📄 结班报告</button>
      </div>
    </div>
    <div class="tabs" id="dtTabs"></div>
    <div class="card"><div class="card-body" id="dtBody"></div></div>
  </section>

  <!-- ===== 培训类别与课程分类 (4.11-P01/P02) ===== -->
  <section id="page-category" class="hidden">
    <div class="page-head">
      <div><div class="breadcrumb" id="crumb">首页 / 培训管理 / 培训类别管理</div><h2 class="page-title" id="pageTitle">培训类别管理</h2></div>
      <div class="page-ops">
        <button class="btn btn-primary" onclick="openCatModal(null)">＋ 新增类别</button>
        <button class="btn btn-ghost" onclick="toast('批量导入功能（原型占位）')">批量导入</button>
        <button class="btn btn-ghost" onclick="toast('导出树形结构功能（原型占位）')">导出</button>
      </div>
    </div>
    <div id="statsArea" class="stat-cards"></div>
    <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div id="treeArea"></div>
      <div id="categoryListArea"></div>
    </div>
  </section>
</main>

<!-- ===== 新建班次向导（4步） ===== -->
<div class="mask hidden" id="wzModal"><div class="modal">
  <div class="modal-head"><span>新建培训班次（分步向导）</span><span class="btn-text js-close">✕</span></div>
  <div class="modal-body">
    <div class="steps" id="wzSteps">
      <div class="step cur" data-n="1">基本信息</div><div class="step" data-n="2">课程组合</div>
      <div class="step" data-n="3">学员与分班</div><div class="step" data-n="4">确认提交</div>
    </div>
    <div id="wzS1">
      <div class="form-grid">
        <div class="f-row full"><label><span class="req">*</span>班次名称（≤60字）</label><input class="input" id="wName" placeholder="如：2507期处级干部进修班"></div>
        <div class="f-row"><label><span class="req">*</span>培训类别</label><select class="sel" id="wCat"><option>党校班</option><option>政能班</option><option>专题研讨班</option><option>任职培训班</option></select></div>
        <div class="f-row"><label><span class="req">*</span>培训对象</label><input class="input" id="wTarget" placeholder="如：处级干部"></div>
        <div class="f-row"><label><span class="req">*</span>主办单位</label><select class="sel" id="wHost"><option>办公厅</option><option>干部司</option><option>机关党委</option></select></div>
        <div class="f-row"><label><span class="req">*</span>承办/协助承办部门</label><select class="sel" id="wDept"><option>教务管理办</option><option>培训部</option><option>科研部</option></select></div>
        <div class="f-row"><label><span class="req">*</span>开始日期</label><input class="input" type="date" id="wStart" value="2026-10-12"></div>
        <div class="f-row"><label><span class="req">*</span>结束日期（≥开始）</label><input class="input" type="date" id="wEnd" value="2026-10-30"></div>
        <div class="f-row full"><label>培训内容</label><textarea class="input" id="wContent" rows="2" placeholder="培训内容概述"></textarea></div>
      </div>
    </div>
    <div id="wzS2" class="hidden">
      <p style="font-size:13px;color:var(--text-2);margin-bottom:10px">从课程体系勾选多门课程，自动汇总课时总量（至少1门）：</p>
      <div id="wzCourses"></div>
      <div style="text-align:right;font-size:14px;margin-top:8px">已选 <b id="wzCnt">0</b> 门 · 课时总量 <b id="wzHours" style="color:var(--primary)">0</b></div>
    </div>
    <div id="wzS3" class="hidden">
      <div class="form-grid">
        <div class="f-row full"><label>学员报名录入（学员端不接入，由管理员统一录入或批量导入）</label>
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="toast('单个新增学员功能（原型占位）')">单个新增</button><button class="btn btn-ghost" onclick="toast('批量导入功能，职级部门变化自动更新基础信息（原型占位）')">批量导入</button></div></div>
        <div class="f-row"><label>分班管控</label><div><span class="switch on" onclick="this.classList.toggle('on')"></span> <span style="font-size:12px;color:var(--text-3)">开启后按分班隔离管理</span></div></div>

function wzRender(){
  for(let i=1;i<=4;i++){$('wzS'+i).classList.toggle('hidden',i!==wzStep)}
  document.querySelectorAll('#wzSteps .step').forEach((el,i)=>{el.classList.toggle('cur',i===wzStep-1);el.classList.toggle('done',i<wzStep-1)});
  $('wzPrev').style.visibility=wzStep===1?'hidden':'visible';
  $('wzNext').textContent=wzStep===4?'提交':'下一步';
}
function wzSum(){
  const cks=[...document.querySelectorAll('#wzCourses input:checked')];
  $('wzCnt').textContent=cks.length;

function wzGo(d){
  if(d>0){
    if(wzStep===1){
      if(!$('wName').value.trim()){toast('班次名称不能为空');return}
      if($('wEnd').value<$('wStart').value){toast('结束日期不得早于开始日期');return}}

    if(wzStep===3){
      const cs=[...document.querySelectorAll('#wzCourses input:checked')].map(x=>WZ_COURSES[+x.value]);
      $('wzSum').innerHTML=`班次名称：<b>${$('wName').value.trim()}</b> ｜ 类别：${$('wCat').value} ｜ 对象：${$('wTarget').value||'—'}<br>

    const hasKids=CATS.some(k=>k.parent===c.id);
    return `<div class="tree-node">
     <div class="tn-row ${curView==='base-category'&&$container===c.id?'active':''}" onclick="$container===c.id?($container=null):($container=c.id);showCategory()">
       <span class="tn-caret ${hasKids?'':'leaf'}">▸</span>
       <span class="tn-ico">${hasKids?'🗂️':'📁'}</span>
       <span class="tn-name">${c.name}</span>
       <span class="tn-cnt">${c.cnt} 个班次</span>
     </div>
     ${hasKids?catTreeHtml(c.id,c.id):''}
    </div>`}).join('')+'</div>';
}
let curView='base-category';
let $treeContainer=null;

function showCategory(){
  curView='base-category';
  $('page-list').classList.add('hidden');
  $('page-detail').classList.add('hidden');
  $('page-category').classList.remove('hidden');
  $('pageTitle').textContent='培训类别管理';
  $('crumb').textContent='首页 / 培训管理 / 培训类别管理';
  renderCategory();
}

function renderCategory(){
  const total=CATS.filter(c=>!c.parent).length,used=CATS.filter(c=>c.status==='启用'&&!c.parent).length;
  const stats=`<div class="stat-cards">
   <div class="stat"><div class="n">${total}</div><div class="l">顶级类别数</div></div>
   <div class="stat"><div class="n g">${used}</div><div class="l">启用类别</div></div>
   <div class="stat"><div class="n">${CATS.reduce((sum,c)=>sum+(c.cnt||0),0)}</div><div class="l">关联班次总数</div></div></div>`;
  $('statsArea').innerHTML=stats;
  $('treeArea').innerHTML=`<div class="tree-panel">
     <div class="tp-head"><b>培训类别树</b><span class="btn-text" onclick="openCatModal(null)">＋ 新增顶级类别</span></div>
     <input class="input" placeholder="🔍 搜索类别名称…" onkeydown="if(event.key==='Enter')toast('搜索类别：'+this.value.trim()+'（原型占位）')">
     ${catTreeHtml(null,$treeContainer)}
   </div>`;
  renderCategoryList();
}

function renderCategoryList(){
  const list=CATS.filter(c=>c.parent);
  const table=`<table class="data-table"><thead><tr><th>类别名称</th><th>类别编码</th><th>上级类别</th><th>描述</th><th>关联班次</th><th>状态</th><th>操作</th></tr></thead><tbody>
     ${list.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.code}</td><td>${CATS.find(p=>p.id===c.parent)?p.name:'—'}</td><td>${c.desc||'—'}</td>
      <td>${c.cnt||0} 个</td><td><span class="tag ${c.status==='启用'?'tag-green':'tag-gray'}">${c.status}</span></td>
      <td><button class="btn-text" onclick="editCatId='${c.id}';openCatModal('${c.id}')">编辑</button>
       <button class="btn-text ${c.status==='停用'?'':'danger'}" onclick="catToggle('${c.id}')">${c.status==='停用'?'启用':'停用'}</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text-3)">暂无二级类别</td></tr>'}
     </tbody></table>`;
  $('categoryListArea').innerHTML=table;
}

function openCatModal(id,pid){
  editCatId=id||null;
  const title=id?'编辑类别':'新增类别';
  $('catModalTitle').textContent=title;
  $('cfParent').innerHTML=CATS.filter(c=>!c.parent).map(c=>`<option value="${c.id}" ${(pid&&pid===c.id)?'selected':''}>${c.name}</option>`).join('');
  if(id){
    const c=CATS.find(x=>x.id===id);
    $('cfName').value=c.name;$('cfCode').value=c.code;$('cfParent').value=c.parent||'';$('cfDesc').value=c.desc||'';$('cfStatus').value=c.status;
  }else{
    $('cfName').value='';$('cfCode').value='';$('cfParent').value='';$('cfDesc').value='';$('cfStatus').value='启用';
  }
  $('catModal').classList.remove('hidden');
}

function catSave(){
  const name=$('cfName').value.trim(),code=$('cfCode').value.trim();
  if(!name){toast('类别名称不能为空');return}
  if(!code){toast('类别编码不能为空');return}
  if(CATS.some(c=>c.code===code&&(editCatId!==c.id))){toast('类别编码已存在，请更换');return}
  const obj={name,code,parent:$('cfParent').value,desc:$('cfDesc').value,status:$('cfStatus').value};
  if(editCatId){
    const idx=CATS.findIndex(c=>c.id===editCatId);
    if(idx>-1)CATS[idx]={...CATS[idx],...obj};
    toast('类别「'+name+'」已更新');
  }else{
    CATS.push({id:'C'+Date.now()%1000,...obj,cnt:0});
    toast('新类别「'+name+'」已添加');
  }
  $('catModal').classList.add('hidden');
  showCategory();
}

function catToggle(id){
  const c=CATS.find(x=>x.id===id);
  c.status=c.status==='启用'?'停用':'启用';
  renderCategory();
  toast('「'+c.name+'』已'+c.status);
}

/* ============ 课程分类管理 (4.11-P02) ============ */
function showCourseCategory(){
  curView='base-course';
  $('page-list').classList.add('hidden');
  $('page-detail').classList.add('hidden');
  $('page-category').classList.remove('hidden');
  $('pageTitle').textContent='课程分类管理';
  $('crumb').textContent='首页 / 培训管理 / 课程分类管理';
  renderCourseCategory();
}

function renderCourseCategory(){
  const content=`<div class="alert">课程分类用于管理体系内课程的层级结构，支持树形分类与课程关联统计。</div>
  <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
   <div class="card"><div class="card-body">
     <div class="sec-title">课程体系示例（树形结构）</div>
     <div class="tree-panel">${catTreeHtml(null,null)}</div>
     <p class="mini-note" style="margin-top:12px;font-size:12px;color:var(--text-3)">课程分类按「课程体系→子体系→课程」三级构建；每个课程体系包含多个独立课程；一个体系下课程自动汇总总课时量。</p>
   </div></div>
   <div class="card"><div class="card-body">
     <div class="sec-title" style="margin-bottom:12px">快捷操作</div>
     <div style="display:flex;flex-direction:column;gap:8px">
       <button class="btn btn-primary" onclick="toast('新增课程体系（原型占位）')">＋ 新增课程体系</button>
       <button class="btn btn-ghost" onclick="toast('批量导入课程分类（原型占位）")">批量导入</button>
       <button class="btn btn-ghost" onclick="toast('导出课程分类清单（原型占位）")">导出清单</button>
       <button class="btn btn-ghost" onclick="toast('关联课程统计（原型占位）")">关联课程统计</button>
     </div>
     <div class="stat-cards" style="margin-top:20px">
       <div class="stat"><div class="n">${CATS.filter(c=>!c.parent).length}</div><div class="l">课程大类</div></div>
       <div class="stat"><div class="n">${CATS.filter(c=>c.parent).length}</div><div class="l">课程子类</div></div>
       <div class="stat"><div class="n">${CATS.reduce((sum,c)=>sum+(c.cnt||0),0)}</div><div class="l">关联课程数</div></div>
     </div>
   </div></div>
  </div>`;
  $('statsArea').innerHTML='';
  $('treeArea').innerHTML='';
  $('categoryListArea').innerHTML=content;
}

/* ============ 初始化（支持 ?page= 直达 Tab） ============ */
renderList();
const q=new URLSearchParams(location.search).get('page');
if(q&&TAB_OF[q]){openDetail(curClass,TAB_OF[q]);setNavActive(document.querySelector('.nav-child[data-id="'+q+'"]'))}
else if(q==='train-schedule'){location.replace('training-schedule.html?class='+curClass)}
else if(q==='base-category'){showCategory();setNavActive(document.querySelector('.nav-child[data-id="base-category"]'))}
else if(q==='base-course'){showCourseCategory();setNavActive(document.querySelector('.nav-child[data-id="base-course"]'))}
else{setNavActive(document.querySelector('.nav-child[data-id="train-class"]'))}
$('tbUser').onclick=()=>toast('个人信息 / 修改密码见 workbench.html 账户入口');
</script>
