<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源管理 · 干部培训学院教务管理系统 原型 V1.0</title>
<style>
:root{--primary:#1F4E79;--primary-2:#2E75B6;--success:#2E7D32;--warning:#F57F17;--danger:#C62828;
 --text:#333;--text-2:#595959;--text-3:#8a9099;--bg:#F5F6F8;--card:#fff;--line:#e5e8ec;
 --topbar-h:56px;--nav-w:220px;--nav-w-c:64px;--r:4px;--r-card:8px;--r-modal:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{text-decoration:none;color:var(--primary-2);cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:4px}
.btn{height:32px;padding:0 16px;border-radius:var(--r);font-size:14px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#173e61}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text-2)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-text{background:none;border:none;color:var(--primary-2);cursor:pointer;font-size:13px;padding:0 4px}
.btn-text:hover{text-decoration:underline}
.btn-text.danger{color:var(--danger)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.tag-blue{background:rgba(46,117,182,.12);color:var(--primary-2)}
.tag-green{background:rgba(46,125,50,.12);color:var(--success)}
.tag-orange{background:rgba(247,127,23,.12);color:var(--warning)}
.tag-red{background:rgba(198,40,40,.12);color:var(--danger)}
.tag-purple{background:rgba(123,80,160,.12);color:#7B50A0}
.tag-cyan{background:rgba(0,137,123,.12);color:#00897B}
.tag-gray{background:rgba(89,95,105,.1);color:var(--text-2)}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-body{padding:16px}
.input,.sel{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.input:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,121,.12)}
/* 顶部栏/导航 */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tb-logo{display:flex;align-items:center;gap:10px;min-width:230px}
.tb-logo .mark{width:32px;height:32px;border-radius:6px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tb-logo .name{font-size:16px;font-weight:700;white-space:nowrap}
.tb-search{flex:1;max-width:460px}.tb-search .input{width:100%;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;height:34px}
.tb-search .input::placeholder{color:rgba(255,255,255,.6)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-icon{position:relative;width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.tb-icon:hover{background:rgba(255,255,255,.15)}
.tb-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-ver{font-size:12px;color:rgba(255,255,255,.65);margin:0 4px}
.tb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.tb-user:hover{background:rgba(255,255,255,.15)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.sidenav{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:90;transition:width .2s}
.nav-parent{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;cursor:pointer;color:var(--text-2);font-size:14px;position:relative}
.nav-parent:hover{background:#f2f6fa;color:var(--primary)}
.nav-icon{width:18px;text-align:center;font-size:15px;flex:none}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-caret{font-size:11px;color:var(--text-3);transition:transform .2s}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-group.open>.nav-parent{color:var(--primary);font-weight:700}
.nav-children{display:none;background:#fafbfc}
.nav-group.open .nav-children{display:block}
.nav-child{padding:0 16px 0 44px;height:36px;display:flex;align-items:center;font-size:13px;color:var(--text-2);cursor:pointer;position:relative}
.nav-child:hover{color:var(--primary);background:#f2f6fa}
.nav-child.active{color:var(--primary);font-weight:700;background:rgba(31,78,121,.08)}
.nav-child.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.nav-collapse{border-top:1px solid var(--line);padding:12px 16px;font-size:13px;color:var(--text-3);cursor:pointer;display:flex;gap:8px;align-items:center}
body.nav-collapsed .sidenav{width:var(--nav-w-c)}
body.nav-collapsed .nav-label,body.nav-collapsed .nav-caret,body.nav-collapsed .nav-children,body.nav-collapsed .nav-collapse span{display:none}
body.nav-collapsed .nav-parent{justify-content:center;padding:0}
body.nav-collapsed .nav-collapse{justify-content:center}
.content{margin-left:var(--nav-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h));transition:margin-left .2s}
body.nav-collapsed .content{margin-left:var(--nav-w-c)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:6px}
.page-title{font-size:20px;font-weight:700}
.page-ops{display:flex;gap:8px}
/* 筛选/表格/卡片网格 */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-bar .input{width:220px}.filter-bar .sel{width:150px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th,.data-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table th{background:#fafbfc;color:var(--text-2);font-size:12px;font-weight:400}
.data-table tbody tr:hover{background:#f7fafd}
.data-table .c-name{font-weight:700;color:var(--primary);cursor:pointer}
.data-table .c-name:hover{text-decoration:underline}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.res-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:14px;cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative}
.res-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.res-card .rc-icon{font-size:24px;margin-bottom:8px}
.res-card .rc-title{font-size:14px;font-weight:700;line-height:1.4;margin-bottom:6px}
.res-card .rc-meta{font-size:12px;color:var(--text-3);line-height:1.8}
.res-card .rc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.res-card .rc-ops{display:flex;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.res-card .fav{position:absolute;top:12px;right:12px;font-size:16px;cursor:pointer;color:#d4d9de}
.res-card .fav.on{color:var(--warning)}
.view-switch{display:flex;gap:0}
.view-switch .btn{border-radius:0}
.view-switch .btn:first-child{border-radius:var(--r) 0 0 var(--r)}
.view-switch .btn:last-child{border-radius:0 var(--r) var(--r) 0}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#f7f9fc;border-radius:var(--r);padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:700;font-family:Consolas,monospace;color:var(--primary)}
.stat .l{font-size:12px;color:var(--text-3);margin-top:2px}
.sec-title{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
/* 标签管理 */
.tag-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.tg-group{padding:10px 14px;border-radius:var(--r);cursor:pointer;font-size:13px;display:flex;justify-content:space-between;margin-bottom:6px}
.tg-group:hover{background:#f2f6fa}
.tg-group.active{background:rgba(31,78,121,.08);color:var(--primary);font-weight:700}
.tg-group .cnt{color:var(--text-3);font-size:12px}
.color-dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px}
.mini-note{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.7}
.alert{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:center;background:rgba(46,117,182,.07);border:1px solid rgba(46,117,182,.2);color:var(--primary)}
/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:210}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);z-index:220;display:flex;flex-direction:column}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{font-size:16px;font-weight:700}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.d-sec{font-size:14px;font-weight:700;margin:18px 0 10px;padding-left:8px;border-left:3px solid var(--primary)}
.d-sec:first-child{margin-top:0}
.d-grid{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px}
.d-grid .k{color:var(--text-3)}
.file-box{display:flex;align-items:center;gap:10px;background:#f7f9fc;border-radius:var(--r);padding:10px 12px;font-size:13px}
.file-box .fi{font-size:20px}
.log-item{display:flex;gap:10px;font-size:12px;color:var(--text-2);padding:7px 0;border-bottom:1px dashed var(--line)}
.log-item .tm{color:var(--text-3);flex:none;width:110px}
/* 弹窗/Toast */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{width:520px;max-height:86vh;background:#fff;border-radius:var(--r-modal);box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:14px 18px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.f-row label .req{color:var(--danger);margin-right:2px}
.f-row .input,.f-row .sel{width:100%}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.chk-line{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.chk-line label{display:flex;align-items:center;gap:5px;font-size:13px;margin:0}
.upload-box{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--text-3);font-size:13px;cursor:pointer}
.upload-box:hover{border-color:var(--primary);color:var(--primary)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(40,45,52,.92);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:300;box-shadow:var(--shadow);max-width:70%}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-logo"><div class="mark">院</div><div class="name">干部培训学院教务管理系统</div></div>
  <div class="tb-search"><input class="input" id="tbSearch" placeholder="🔍 全局搜索：班次 / 学员 / 师资 / 课程…"></div>
  <div class="tb-right">
    <span class="tb-ver">V1.0 原型</span>
    <div class="tb-icon" onclick="toast('跳转消息中心（原型占位）')" title="站内信">🔔<span class="tb-badge">5</span></div>
    <div class="tb-icon" onclick="toast('帮助中心为原型占位')" title="帮助中心">❓</div>
    <div class="tb-user" id="tbUser"><div class="tb-avatar">张</div><span>张三</span><span style="font-size:10px">▼</span></div>
  </div>
</header>

<aside class="sidenav" id="sidenav"></aside>

<main class="content">
  <div class="page-head">
    <div><div class="breadcrumb" id="crumb">首页 / 资源管理 / 教案库</div><h2 class="page-title" id="pageTitle">教案库</h2></div>
    <div class="page-ops" id="pageOps"></div>
  </div>
  <div class="alert">🏷 各资源库支持自定义标签化管理，标签跨库共享，实现资源智能联想推荐与多维度分类检索（V3.2 资源管理 · 标签管理）。</div>

  <!-- 通用筛选区 -->
  <div class="card" style="margin-bottom:16px" id="filterCard"><div class="card-body" style="padding:14px 16px">
    <div class="filter-bar">
      <input class="input" id="fKw" placeholder="名称模糊搜索…" oninput="renderView()">
      <select class="sel" id="fTag" onchange="renderView()"><option value="">全部标签</option></select>
      <select class="sel" id="fStatus" onchange="renderView()"><option value="">全部状态</option></select>
      <div class="view-switch" style="margin-left:auto" id="viewSwitch">
        <button class="btn btn-primary" id="vsCard" onclick="setView('card')">▦ 卡片</button>
        <button class="btn btn-ghost" id="vsTable" onclick="setView('table')">☰ 表格</button>
      </div>
    </div>
  </div></div>

  <!-- 资源内容区 -->
  <div id="viewBody"></div>
</main>

<!-- 详情抽屉 -->
<div class="drawer-mask hidden" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer hidden" id="resDrawer">
  <div class="drawer-head"><h3 id="dwTitle">资源详情</h3><span class="btn-text" onclick="closeDrawer()">✕ 关闭</span></div>
  <div class="drawer-body" id="dwBody"></div>
  <div class="drawer-foot" id="dwFoot"></div>
</div>

<!-- 上传/新建弹窗 -->
<div class="mask hidden" id="upModal"><div class="modal">
  <div class="modal-head"><span id="upTitle">上传资源</span><span class="btn-text js-close">✕</span></div>
  <div class="modal-body">
    <div class="f-row"><label><span class="req">*</span>资源名称</label><input class="input" id="upName" placeholder="请输入名称"></div>
    <div class="f-row" id="upTplRow"><label>教案模板</label><select class="sel" id="upTpl"><option>标准化教案模板 V2</option><option>理论课教案模板</option><option>案例教学教案模板</option><option>研讨课教案模板</option></select></div>
    <div class="f-row"><label>关联课程（可多选，绑定后课程详情页可见）</label><select class="sel" id="upCourse"><option>习近平外交思想概论</option><option>宏观经济形势分析</option><option>党性修养与理想信念教育</option><option>国际谈判实务与模拟演练</option><option>外交礼仪与礼宾实务</option></select></div>
    <div class="f-row"><label>资源标签（跨库共享标签，可多选）</label><div class="chk-line" id="upTags"></div></div>
    <div class="f-row"><label>资源文件</label><div class="upload-box" onclick="toast('文件选择（原型占位）')">⬆ 点击或拖拽文件到此处上传<br><span style="font-size:12px">支持 doc/docx/pdf/ppt/pptx/zip，≤200MB</span></div></div>
    <div class="f-row"><label>资源简介</label><textarea class="input" rows="2" placeholder="选填"></textarea></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost js-close">取消</button><button class="btn btn-primary" onclick="upSave()">保存</button></div>
</div></div>

<script>
function $(id){return document.getElementById(id)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
document.querySelectorAll('.js-close').forEach(b=>b.onclick=e=>e.target.closest('.mask').classList.add('hidden'));
const TAG_CLS={'理论':'tag-blue','党性':'tag-red','政策':'tag-orange','技能':'tag-green','案例教学':'tag-purple','外交业务':'tag-cyan','数字化':'tag-blue','廉政':'tag-red','礼仪':'tag-green','谈判':'tag-purple'};
function tagHtml(tags){return (tags||[]).map(t=>'<span class="tag '+(TAG_CLS[t]||'tag-gray')+'">'+t+'</span>').join('')}

/* ============ 导航 ============ */
const NAV=[
 {id:'workbench',icon:'🏠',name:'工作台',direct:true},
 {id:'teach',icon:'📚',name:'教学管理',children:[{id:'teach-system',name:'课程体系',pg:'4.2-P01'},{id:'teach-course',name:'课程管理',pg:'4.2-P02'}]},
 {id:'train',icon:'🎓',name:'培训管理',children:[{id:'train-class',name:'培训班管理',pg:'4.3-P01'},{id:'base-category',name:'培训类别',pg:'4.11-P01'},{id:'base-course',name:'课程分类',pg:'4.11-P02'}]},
 {id:'resource',icon:'🗂️',name:'资源管理',children:[
   {id:'res-plan',name:'教案库',pg:'4.4-P01'},{id:'res-book',name:'教材库',pg:'4.4-P02'},
   {id:'res-case',name:'案例库',pg:'4.4-P03'},{id:'res-self',name:'自他资源库',pg:'4.4-P04'},
   {id:'res-bank',name:'题库试卷库',pg:'4.4-P05'},{id:'res-tag',name:'标签管理',pg:'4.4-P06'}]},
 {id:'edu',icon:'📊',name:'教务组织',children:[{id:'edu-plan',name:'教学计划管理',pg:'4.5-P01'},{id:'edu-data',name:'教务数据管理',pg:'4.5-P02'},{id:'edu-report',name:'多维度报表',pg:'4.5-P03'},{id:'edu-export',name:'数据导出与集成',pg:'4.5-P04'},{id:'edu-settle',name:'结算报告模板',pg:'4.5-P05'}]},
 {id:'teacher',icon:'👥',name:'师资库',children:[{id:'tea-list',name:'师资信息',pg:'4.6-P01'},{id:'tea-tag',name:'分级分类标签',pg:'4.6-P03'},{id:'tea-archive',name:'授课质量档案',pg:'4.6-P02'},{id:'tea-invite',name:'授课邀请函',pg:'4.6-P04'},{id:'tea-report',name:'综合评价报告',pg:'4.6-P05'}]},
 {id:'student',icon:'✪',name:'学员库',children:[{id:'stu-list',name:'学员信息',pg:'4.7-P01'},{id:'stu-query',name:'个人综合查询',pg:'4.7-P02'},{id:'stu-archive',name:'参训档案',pg:'4.7-P03'}]},
 {id:'room',icon:'🏫',name:'教室管理',children:[{id:'room-point',name:'教学点管理',pg:'4.8-P01'},{id:'room-room',name:'教室管理',pg:'4.8-P02'},{id:'room-device',name:'人脸考勤设备',pg:'4.8-P03'}]},
 {id:'approve',icon:'✅',name:'审批管理',children:[{id:'apv-schedule',name:'排课审批',pg:'4.9-P01'},{id:'apv-budget',name:'预算审批',pg:'4.9-P01'},{id:'apv-leave',name:'请假/调停课审批',pg:'4.9-P01'},{id:'apv-record',name:'审批记录',pg:'4.9-P03'}]},

    <div class="sec-title">题库管理<button class="btn btn-ghost" style="margin-left:auto;height:28px;font-size:13px" onclick="toast('新建题库（原型占位）')">＋ 新建题库</button></div>

    ${tk.map(x=>`<tr><td class="c-name" onclick="openDrawer('${x.id}')">${x.icon} ${x.name}</td><td>${x.qp}</td><td>${x.course}</td><td><span class="tag ${STATUS[x.status]}">${x.status}</span></td><td><button class="btn-text" onclick="toast('题目维护：单选/多选/判断/简答/案例分析（原型占位）')">题目维护</button><button class="btn-text" onclick="toast('按知识点/难度抽题（原型占位）')">抽题</button></td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="card"><div class="card-body">
    <div class="sec-title">试卷管理（支撑线下考试）<button class="btn btn-primary" style="margin-left:auto;height:28px;font-size:13px" onclick="toast('按知识点/难度自动抽题组卷（原型占位）')">🧩 智能组卷</button></div>
    <table class="data-table"><thead><tr><th>试卷名称</th><th>组卷规则</th><th>关联课程</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${sj.map(x=>`<tr><td class="c-name" onclick="openDrawer('${x.id}')">${x.icon} ${x.name}</td><td>${x.qp}</td><td>${x.course}</td><td><span class="tag ${STATUS[x.status]||'tag-gray'}">${x.status}</span></td><td><button class="btn-text" onclick="toast('试卷预览（原型占位）')">预览</button><button class="btn-text" onclick="toast('用于考务管理线下考试（4.3-P09）')">用于考试</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function renderTags(){
  $('viewBody').innerHTML=`
  <div class="tag-layout">
    <div class="card"><div class="card-body">
      <div class="sec-title">标签分组<button class="btn btn-primary btn-sm" style="margin-left:auto;height:26px;font-size:12px" onclick="toast('新建标签分组（原型占位）')">＋</button></div>
      ${TAG_GROUPS.map((g,i)=>`<div class="tg-group ${i===0?'active':''}" onclick="toast('切换分组：${g.g}（原型演示展示全部）')">${g.g}<span class="cnt">${g.items.length}</span></div>`).join('')}
      <p class="mini-note">标签可跨库共享：教材库、案例库、教案库、师资库等共用同一标签体系，实现智能联想推荐与多维度分类检索。</p>
    </div></div>
    <div class="card"><div class="card-body">
      <div class="sec-title">标签列表<button class="btn btn-primary" style="margin-left:auto;height:28px;font-size:13px" onclick="openTagModal()">＋ 新建标签</button></div>
      <table class="data-table"><thead><tr><th>标签</th><th>颜色</th><th>所属分组</th><th>引用资源数</th><th>共享库</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${TAG_GROUPS.flatMap(g=>g.items.map(t=>`<tr>
        <td><span class="color-dot" style="background:${{'tag-blue':'#2E75B6','tag-red':'#C62828','tag-orange':'#F57F17','tag-green':'#2E7D32','tag-purple':'#7B50A0','tag-cyan':'#00897B','tag-gray':'#8a9099'}[t[1]]}"></span><b>${t[0]}</b></td>
        <td><span class="tag ${t[1]}">预览</span></td><td>${g.g}</td><td>${t[2]}</td>
        <td>教案 / 教材 / 案例 / 师资 / 题库</td><td><span class="tag tag-green">启用</span></td>
        <td><button class="btn-text" onclick="toast('重命名后历史挂接保留（原型占位）')">编辑</button><button class="btn-text" onclick="toast('跨库检索「${t[0]}」同类资源（原型占位）')">跨库检索</button><button class="btn-text danger" onclick="toast('停用标签：历史保留、新增不可选（原型占位）')">停用</button></td></tr>`)).join('')}
      </tbody></table>
      <p class="mini-note">点击标签可跨库检索同类资源；停用标签不影响历史资源挂接（历史保留、新增不可选）；标签变更留痕，纳入操作日志。</p>
    </div></div>
  </div>`;
}

/* ============ 详情抽屉 ============ */
function findRes(id){for(const k in DATA){const x=DATA[k].find(r=>r.id===id);if(x)return x}return null}
function openDrawer(id){
  const x=findRes(id);if(!x)return;
  $('dwTitle').textContent=x.name;
  $('dwBody').innerHTML=`
   <div class="d-sec">基本信息</div>
   <div class="d-grid">
    <span class="k">资源编号</span><span>${x.id}</span>
    ${x.tpl?'<span class="k">教案模板</span><span>'+x.tpl+'</span>':''}
    ${x.author?'<span class="k">作者/编者</span><span>'+x.author+'</span>':''}
    ${x.pub?'<span class="k">出版社</span><span>'+x.pub+'</span>':''}
    ${x.cat?'<span class="k">分类</span><span>'+x.cat+(x.src&&x.src!=='—'?' · 来源：'+x.src:'')+'</span>':''}
    ${x.course?'<span class="k">关联课程</span><span>'+x.course+'</span>':''}
    ${x.qp?'<span class="k">题型/规则</span><span>'+x.qp+'</span>':''}
    ${x.ver?'<span class="k">版本</span><span>'+x.ver+'</span>':''}
    ${x.favN!==undefined?'<span class="k">收藏/引用</span><span>★ '+x.favN+' 收藏 · '+x.refN+' 门课程引用</span>':''}
    <span class="k">状态</span><span><span class="tag ${STATUS[x.status]||'tag-gray'}">${x.status}</span></span>
    <span class="k">更新时间</span><span>${x.time}</span>
   </div>
   <div class="d-sec">资源标签（跨库共享）</div>
   <div style="display:flex;gap:6px;flex-wrap:wrap">${tagHtml(x.tags)}<button class="btn-text" onclick="toast('编辑标签（原型占位）')">＋编辑</button></div>
   <div class="d-sec">附件</div>
   <div class="file-box"><span class="fi">📎</span><span style="flex:1">${x.file}</span><a onclick="toast('在线预览（原型占位）')">预览</a><a onclick="toast('下载（原型占位）')">下载</a></div>
   <div class="d-sec">智能联想推荐（基于共享标签）</div>
   <div style="font-size:13px;color:var(--text-2);line-height:2">
    · 《大国外交：理论与实践》（教材 · 同标签「理论」）<br>
    · 某多边外交场合危机处置案例（案例 · 同标签「案例教学」）<br>
    · 王教授（师资库 · 同学科领域）</div>
   <div class="d-sec">操作日志</div>
   <div class="log-item"><span class="tm">${x.time}</span><span>张三 更新资源</span></div>
   <div class="log-item"><span class="tm">2026-08-30</span><span>李四 添加标签</span></div>
   <div class="log-item"><span class="tm">2026-08-12</span><span>张三 创建资源</span></div>`;
  $('dwFoot').innerHTML=`<button class="btn btn-ghost" onclick="toast('下载（原型占位）')">下载</button><button class="btn btn-primary" onclick="toast('编辑资源（原型占位）')">编辑</button>`;
  $('drawerMask').classList.remove('hidden');$('resDrawer').classList.remove('hidden');
}
function closeDrawer(){$('drawerMask').classList.add('hidden');$('resDrawer').classList.add('hidden')}
function toggleFav(id){const x=findRes(id);if(!x)return;x.fav=!x.fav;if(x.favN!==undefined)x.favN+=x.fav?1:-1;renderView();toast(x.fav?'已收藏':'已取消收藏')}

/* ============ 上传/新建弹窗 ============ */
function openUp(title){
  $('upTitle').textContent=title.replace('＋ ','');
  $('upName').value='';
  $('upTplRow').classList.toggle('hidden',curLib!=='res-plan');
  $('upTags').innerHTML=[...new Set(Object.values(DATA).flat().flatMap(x=>x.tags))].map(t=>`<label><input type="checkbox" value="${t}">${t}</label>`).join('');
  $('upModal').classList.remove('hidden');
}
function upSave(){
  const name=$('upName').value.trim();
  if(!name){toast('资源名称不能为空');return}
  const tags=[...document.querySelectorAll('#upTags input:checked')].map(x=>x.value);
  const key=LIB_KEY[curLib];
  DATA[key].unshift({id:key.toUpperCase()+Date.now()%1000,icon:'📄',name,course:$('upCourse').value,author:'张三',ver:'V1',status:'草稿',time:'2026-09-25',tags,file:'待上传',fav:false,tpl:curLib==='res-plan'?$('upTpl').value:undefined,cat:key==='case'?'外交实务':undefined,src:key==='case'?'原创':undefined,favN:key==='case'?0:undefined,refN:key==='case'?0:undefined});
  $('upModal').classList.add('hidden');showLib(curLib);toast('「'+name+'」已保存为草稿，标签跨库共享生效');
}
function openTagModal(){toast('新建标签：名称+颜色+分组，保存后各库可选（原型占位）')}

/* ============ 初始化 ============ */
const q=new URLSearchParams(location.search).get('page');
showLib(q&&LIB_NAME[q]?q:'res-plan');
setNavActive(document.querySelector('.nav-child[data-id="'+(q&&LIB_NAME[q]?q:'res-plan')+'"]'));
</script>
</body>
</html>
