<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>师资库 · 干部培训学院教务管理系统 原型 V1.0</title>
<style>
:root{--primary:#1F4E79;--primary-2:#2E75B6;--success:#2E7D32;--warning:#F57F17;--danger:#C62828;
 --text:#333;--text-2:#595959;--text-3:#8a9099;--bg:#F5F6F8;--card:#fff;--line:#e5e8ec;
 --topbar-h:56px;--nav-w:220px;--nav-w-c:64px;--r:4px;--r-card:8px;--r-modal:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{text-decoration:none;color:var(--primary-2);cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:4px}
.btn{height:32px;padding:0 16px;border-radius:var(--r);font-size:14px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#173e61}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text-2)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-text{background:none;border:none;color:var(--primary-2);cursor:pointer;font-size:13px;padding:0 4px}
.btn-text:hover{text-decoration:underline}
.btn-text.danger{color:var(--danger)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.tag-blue{background:rgba(46,117,182,.12);color:var(--primary-2)}
.tag-green{background:rgba(46,125,50,.12);color:var(--success)}
.tag-orange{background:rgba(247,127,23,.12);color:var(--warning)}
.tag-red{background:rgba(198,40,40,.12);color:var(--danger)}
.tag-purple{background:rgba(123,80,160,.12);color:#7B50A0}
.tag-gold{background:rgba(191,144,0,.14);color:#9a7400}
.tag-gray{background:rgba(89,95,105,.1);color:var(--text-2)}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-body{padding:16px}
.input,.sel{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.input:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,121,.12)}
/* 顶部栏/导航 */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tb-logo{display:flex;align-items:center;gap:10px;min-width:230px}
.tb-logo .mark{width:32px;height:32px;border-radius:6px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tb-logo .name{font-size:16px;font-weight:700;white-space:nowrap}
.tb-search{flex:1;max-width:460px}.tb-search .input{width:100%;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;height:34px}
.tb-search .input::placeholder{color:rgba(255,255,255,.6)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-icon{position:relative;width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.tb-icon:hover{background:rgba(255,255,255,.15)}
.tb-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-ver{font-size:12px;color:rgba(255,255,255,.65);margin:0 4px}
.tb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.tb-user:hover{background:rgba(255,255,255,.15)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.sidenav{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:90;transition:width .2s}
.nav-parent{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;cursor:pointer;color:var(--text-2);font-size:14px;position:relative}
.nav-parent:hover{background:#f2f6fa;color:var(--primary)}
.nav-icon{width:18px;text-align:center;font-size:15px;flex:none}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-caret{font-size:11px;color:var(--text-3);transition:transform .2s}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-group.open>.nav-parent{color:var(--primary);font-weight:700}
.nav-children{display:none;background:#fafbfc}
.nav-group.open .nav-children{display:block}
.nav-child{padding:0 16px 0 44px;height:36px;display:flex;align-items:center;font-size:13px;color:var(--text-2);cursor:pointer;position:relative}
.nav-child:hover{color:var(--primary);background:#f2f6fa}
.nav-child.active{color:var(--primary);font-weight:700;background:rgba(31,78,121,.08)}
.nav-child.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.nav-collapse{border-top:1px solid var(--line);padding:12px 16px;font-size:13px;color:var(--text-3);cursor:pointer;display:flex;gap:8px;align-items:center}
body.nav-collapsed .sidenav{width:var(--nav-w-c)}
body.nav-collapsed .nav-label,body.nav-collapsed .nav-caret,body.nav-collapsed .nav-children,body.nav-collapsed .nav-collapse span{display:none}
body.nav-collapsed .nav-parent{justify-content:center;padding:0}
body.nav-collapsed .nav-collapse{justify-content:center}
.content{margin-left:var(--nav-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h));transition:margin-left .2s}
body.nav-collapsed .content{margin-left:var(--nav-w-c)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:6px}
.page-title{font-size:20px;font-weight:700}
.page-ops{display:flex;gap:8px;flex-wrap:wrap}
/* 筛选/子Tab/统计卡 */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-bar .input{width:190px}.filter-bar .sel{width:140px}
.sub-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.sub-tab{padding:9px 18px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.sub-tab:hover{color:var(--primary)}
.sub-tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#f7f9fc;border-radius:var(--r);padding:14px;text-align:center}
.stat .n{font-size:24px;font-weight:700;font-family:Consolas,monospace;color:var(--primary)}
.stat .n.g{color:var(--success)}.stat .n.o{color:var(--warning)}.stat .n.r{color:var(--danger)}
.stat .l{font-size:12px;color:var(--text-3);margin-top:2px}
/* 表格 */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th,.data-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.data-table th{background:#fafbfc;color:var(--text-2);font-size:12px;font-weight:400;white-space:nowrap}
.data-table tbody tr:hover{background:#f7fafd}
.data-table .c-name{font-weight:700;color:var(--primary);cursor:pointer}
.data-table .c-name:hover{text-decoration:underline}
.score-high{color:var(--success);font-weight:700}
.score-low{color:var(--danger);font-weight:700}
/* 进度条 */
.bar{background:#edf0f3;border-radius:999px;height:8px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--primary-2)}
.bar i.g{background:var(--success)}.bar i.o{background:var(--warning)}.bar i.r{background:var(--danger)}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-row span{font-size:12px;color:var(--text-2);width:44px;text-align:right;flex:none}
.sec-title{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.mini-note{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.7}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.view-switch{display:flex;gap:0}
.view-switch .btn{border-radius:0}
.view-switch .btn:first-child{border-radius:var(--r) 0 0 var(--r)}
.view-switch .btn:last-child{border-radius:0 var(--r) var(--r) 0}
/* 师资卡片 */
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.t-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:16px;transition:box-shadow .15s,transform .15s;position:relative}
.t-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.t-card .th{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.t-ava{width:48px;height:48px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
.t-card .t-name{font-size:15px;font-weight:700}
.t-card .t-pos{font-size:12px;color:var(--text-3);margin-top:2px}
.t-card .t-meta{font-size:12px;color:var(--text-2);line-height:1.9}
.t-card .t-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.t-card .t-score{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--text-3)}
.t-card .t-score b{font-size:17px;font-family:Consolas,monospace;display:block;text-align:center}
.t-card .t-ops{display:flex;gap:2px;margin-top:10px}
.lvl{position:absolute;top:14px;right:14px}
/* 评价标签云 */
.tag-cloud{display:flex;gap:8px;flex-wrap:wrap}
.tag-cloud .tc{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;cursor:default;display:flex;gap:6px;align-items:center}
.tag-cloud .tc b{color:var(--primary);font-family:Consolas,monospace}
/* 预警/提示 */
.alert{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:center;background:rgba(46,117,182,.07);border:1px solid rgba(46,117,182,.2);color:var(--primary)}
/* 抽屉/弹窗/Toast */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:210}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);z-index:220;display:flex;flex-direction:column}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{font-size:16px;font-weight:700}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.d-sec{font-size:14px;font-weight:700;margin:18px 0 10px;padding-left:8px;border-left:3px solid var(--primary)}
.d-sec:first-child{margin-top:0}
.d-grid{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px}
.d-grid .k{color:var(--text-3)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{width:540px;max-height:86vh;background:#fff;border-radius:var(--r-modal);box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:14px 18px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.f-row label .req{color:var(--danger);margin-right:2px}
.f-row .input,.f-row .sel,.f-row textarea{width:100%}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk-line{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}
.chk-line label{display:flex;align-items:center;gap:5px;font-size:13px;margin:0}
.match-box{background:#f2f8f2;border:1px solid rgba(46,125,50,.3);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--success);margin-top:6px;line-height:1.8}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(40,45,52,.92);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:300;box-shadow:var(--shadow);max-width:70%}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-logo"><div class="mark">院</div><div class="name">干部培训学院教务管理系统</div></div>
  <div class="tb-search"><input class="input" id="tbSearch" placeholder="🔍 全局搜索：师资姓名 / 教学领域 / 课程…"></div>
  <div class="tb-right">
    <span class="tb-ver">V1.0 原型</span>
    <div class="tb-icon" onclick="toast('跳转消息中心（原型占位）')" title="站内信">🔔<span class="tb-badge">5</span></div>
    <div class="tb-icon" onclick="toast('帮助中心为原型占位')" title="帮助中心">❓</div>
    <div class="tb-user" id="tbUser"><div class="tb-avatar">张</div><span>张三</span><span style="font-size:10px">▼</span></div>
  </div>
</header>

<aside class="sidenav" id="sidenav"></aside>

<main class="content">
  <div class="page-head">
    <div><div class="breadcrumb" id="crumb">首页 / 师资库 / 师资信息</div><h2 class="page-title" id="pageTitle">师资信息</h2></div>
    <div class="page-ops" id="pageOps"></div>
  </div>
  <div id="viewBody"></div>
</main>

<!-- 师资详情抽屉 -->
<div class="drawer-mask hidden" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer hidden" id="drawer">
  <div class="drawer-head"><h3 id="dwTitle">师资详情</h3><span class="btn-text" onclick="closeDrawer()">✕ 关闭</span></div>
  <div class="drawer-body" id="dwBody"></div>
  <div class="drawer-foot" id="dwFoot"></div>
</div>

<!-- 新增/编辑师资弹窗 -->
<div class="mask hidden" id="tModal"><div class="modal">
  <div class="modal-head"><span id="tModalTitle">新增师资</span><span class="btn-text js-close">✕</span></div>
  <div class="modal-body">
    <div class="f-2col">
     <div class="f-row"><label><span class="req">*</span>教员姓名</label><input class="input" id="tfName" placeholder="请输入姓名"></div>
     <div class="f-row"><label><span class="req">*</span>教员来源</label><select class="sel" id="tfSrc"><option>院内教师</option><option>外聘专家</option><option>部委专家</option><option>兄弟干院</option></select></div>
     <div class="f-row"><label>所在单位</label><input class="input" id="tfUnit" placeholder="如：外交学院"></div>
     <div class="f-row"><label>职务/职称</label><input class="input" id="tfPos" placeholder="如：教授"></div>
     <div class="f-row"><label>联系电话</label><input class="input" id="tfPhone" placeholder="内线或手机号"></div>
     <div class="f-row"><label><span class="req">*</span>教学领域（分类）</label><select class="sel" id="tfField"></select></div>
     <div class="f-row"><label><span class="req">*</span>教学等级（分级）</label><select class="sel" id="tfLevel"></select></div>
     <div class="f-row"><label>研究方向</label><input class="input" id="tfDir" placeholder="研究方向"></div>
    </div>
    <div class="f-row"><label>评价标签（可多选，后续可在「分级分类标签」页维护）</label><div class="chk-line" id="tfTags"></div></div>
    <div class="f-row"><label>个人简介</label><textarea class="input" rows="2" id="tfIntro" placeholder="个人简介"></textarea></div>
    <div class="f-row"><label>教学成果</label><textarea class="input" rows="2" id="tfAch" placeholder="获奖、课题、精品课程等"></textarea></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost js-close">取消</button><button class="btn btn-primary" onclick="tSave()">保存</button></div>
</div></div>

<!-- 授课邀请函弹窗 -->
<div class="mask hidden" id="invModal"><div class="modal">
  <div class="modal-head"><span>新建授课邀请函</span><span class="btn-text js-close">✕</span></div>
  <div class="modal-body">
    <div class="f-row"><label><span class="req">*</span>邀请教师</label><select class="sel" id="invT" onchange="invMatch()"></select></div>
    <div class="f-row"><label><span class="req">*</span>邀请课程</label><select class="sel" id="invC" onchange="invMatch()">
      <option data-field="理论教育" data-level="一级 · 名师">习近平外交思想概论</option>
      <option data-field="经济金融" data-level="二级 · 资深">宏观经济形势分析</option>
      <option data-field="党性教育" data-level="二级 · 资深">党性修养与理想信念教育</option>
      <option data-field="外交实务" data-level="三级 · 骨干">国际谈判实务与模拟演练</option>
      <option data-field="技能实训" data-level="三级 · 骨干">外交礼仪与礼宾实务</option></select></div>
    <div class="match-box hidden" id="invMatchBox"></div>
    <div class="f-2col">
     <div class="f-row"><label><span class="req">*</span>培训班次</label><select class="sel" id="invCls"><option>党校班（第26期）</option><option>政能班（第9期）</option><option>驻外干部轮训班</option></select></div>
     <div class="f-row"><label><span class="req">*</span>拟授课时间</label><input class="input" id="invDate" type="date" value="2026-10-12"></div>
     <div class="f-row"><label>课时数</label><input class="input" id="invHours" type="number" value="4" min="1"></div>
     <div class="f-row"><label>课酬标准</label><select class="sel" id="invFee"><option>正高级：1500元/课时</option><option>副高级：1000元/课时</option><option>其他：600元/课时</option></select></div>
    </div>
    <div class="f-row"><label>邀请函附言</label><textarea class="input" rows="2" id="invMsg" placeholder="尊敬的××教授，诚邀您为…"></textarea></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost js-close">取消</button><button class="btn btn-ghost" onclick="invSave(false)">存为待发送</button><button class="btn btn-primary" onclick="invSave(true)">发送邀请</button></div>
</div></div>

<script>
function $(id){return document.getElementById(id)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
document.querySelectorAll('.js-close').forEach(b=>b.onclick=e=>e.target.closest('.mask').classList.add('hidden'));

/* ============ 导航（全站共享数据） ============ */
const NAV=[
 {id:'workbench',icon:'🏠',name:'工作台',direct:true},
 {id:'teach',icon:'📚',name:'教学管理',children:[{id:'teach-system',name:'课程体系',pg:'4.2-P01'},{id:'teach-course',name:'课程管理',pg:'4.2-P02'}]},
 {id:'train',icon:'🎓',name:'培训管理',children:[
   {id:'train-class',name:'培训班管理',pg:'4.3-P01'},{id:'train-stu',name:'培训考生',pg:'4.3-P03'},
   {id:'train-schedule',name:'培训排课（拖拽）',pg:'4.3-P04'},{id:'train-grade',name:'课程成绩',pg:'4.3-P06'},
   {id:'train-cert',name:'电子证书',pg:'4.3-P07'},{id:'train-eval',name:'教学评估',pg:'4.3-P08'},

  const c=$('invC').selectedOptions[0];
  const fd=c.dataset.field,lv=c.dataset.level;
  const okF=t.field===fd,okL=LEVELS.indexOf(t.level)<=LEVELS.indexOf(lv);
  const box=$('invMatchBox');box.classList.remove('hidden');
  if(okF&&okL){box.style.background='#f2f8f2';box.style.color='var(--success)';
    box.innerHTML='✅ 匹配校验通过：教学领域匹配（'+fd+'），等级满足课程要求（'+lv+'及以上）；近期档期无冲突'}
  else{box.style.background='#fdf5f5';box.style.color='var(--danger)';
    box.innerHTML='⚠ 匹配提醒：'+(!okF?'教学领域不匹配（课程要求 '+fd+'，该教师为 '+t.field+'）；':'')+(!okL?'等级低于课程要求（需 '+lv+'及以上）；':'')+'可继续发送，由审批环节把关'}
}
function invSave(send){
  const t=findT($('invT').value);
  if(!t){toast('请选择教师');return}
  const no='YQ-2026-'+String(34+INVITES.length).padStart(3,'0');
  INVITES.unshift({no,t:t.name,course:$('invC').value,cls:$('invCls').value,date:$('invDate').value,hours:$('invHours').value||4,status:send?'待确认':'待发送',fee:$('invFee').value});
  $('invModal').classList.add('hidden');showView('tea-invite');setNavActive(document.querySelector('.nav-child[data-id=tea-invite]'));
  toast(send?'邀请函已发送（站内信+短信待发送导出），等待教师确认':'已存为待发送草稿');
}
function sendInv(i){INVITES[i].status='待确认';render();toast('邀请函已发送（站内信+短信导出）')}
function simInv(i,ok){INVITES[i].status=ok?'已确认':'已婉拒';render();toast(ok?'教师已确认，可进入拖拽排课':'教师婉拒：档期冲突，建议改邀同领域教师')}
function cancelInv(i){INVITES[i].status='已取消';render();toast('已撤回邀请')}
function delInv(i){if(confirm('确认删除该待发送邀请函？')){INVITES.splice(i,1);render();toast('已删除')}}

/* ============ 4.6-P05 综合评价报告 ============ */
function vReport(){
  const t=findT(repT)||TEACHERS[0];
  const dims=[['教学态度',Math.min(98,t.stu+2)],['内容深度',t.stu],['方法互动',Math.round(t.stu-2.5)],['课堂效果',Math.round(t.stu+1)],['督导评价',t.sup]];
  const overall=((t.stu*0.5+t.sup*0.3+Math.min(t.hours/3,98)*0.2)).toFixed(1);
  return `<div class="filter-bar">
   <select class="sel" style="width:220px" onchange="repT=this.value;render()">
    ${TEACHERS.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.name}（${x.field} · ${x.level}）</option>`).join('')}</select>
   <span style="font-size:12px;color:var(--text-3)">报告数据来源：学员评教（权重50%）+ 督导评分（30%）+ 授课量（20%），支持导出 PDF 归档</span>
   <button class="btn btn-primary" style="margin-left:auto" onclick="toast('综合评价报告已生成，可在导出任务中下载 PDF')">生成报告</button></div>
  <div class="grid-2">
   <div class="card"><div class="card-body">
    <div class="sec-title">👤 ${t.name} · 综合评价报告（2026 年度）</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">
     <div class="t-ava" style="width:64px;height:64px;font-size:24px">${t.name[0]}</div>
     <div><div style="font-size:16px;font-weight:700">${t.name}　<span class="tag ${LVL_CLS[t.level]}">${t.level}</span></div>
      <div style="font-size:12px;color:var(--text-3);margin-top:4px">${t.unit} · ${t.pos} · ${t.field}领域</div></div>
     <div style="margin-left:auto;text-align:center"><div style="font-size:34px;font-weight:700;font-family:Consolas,monospace" class="${scoreCls(+overall)}">${overall}</div><div style="font-size:12px;color:var(--text-3)">综合得分</div></div></div>
    ${dims.map(d=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px">
     <span style="width:64px;color:var(--text-2)">${d[0]}</span>
     <div class="bar" style="flex:1"><i class="${d[1]>=90?'g':d[1]>=85?'o':'r'}" style="width:${d[1]}%"></i></div>
     <span style="width:40px;text-align:right" class="${scoreCls(d[1])}">${d[1]}</span></div>`).join('')}
    <div class="sec-title" style="margin-top:18px">🏷 评价标签 TOP</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${t.tags.map(x=>`<span class="tag tag-orange">${x}</span>`).join('')}</div>
    <p class="mini-note">建议：${t.stu>=93?'教学表现优异，建议纳入名师库并优先安排重点班次':t.stu>=88?'教学表现良好，建议保持并参与集体备课提升':'建议安排督导帮扶与集体备课，关注评教改进'}。</p></div></div>
   <div class="card"><div class="card-body">
    <div class="sec-title">📊 数据构成</div>
    <div class="d-grid" style="grid-template-columns:130px 1fr">
     <span class="k">学员评教份数</span><span>${t.courses.length*45} 份（含纸质评教录入）</span>
     <span class="k">督导巡课次数</span><span>${VISITS.filter(v=>v.t===t.id).length} 次</span>
     <span class="k">累计授课</span><span>${t.hours} 课时 / ${t.courses.length} 门课程</span>
     <span class="k">异常评分识别</span><span>${t.stu<88?'<span class="tag tag-red">存在低分预警，已标记</span>':'<span class="tag tag-green">无异常值</span>'}</span>
     <span class="k">报告周期</span><span>2026-01-01 至 2026-09-25</span></div>
    <div class="sec-title" style="margin-top:18px">📚 历史课程得分</div>
    <table class="data-table"><thead><tr><th>课程</th><th>班次</th><th>评教</th></tr></thead><tbody>
    ${t.courses.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td><span class="${scoreCls(c[2])}">${c[2]}</span></td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--text-3)">暂无</td></tr>'}
    </tbody></table>
    <div style="display:flex;gap:8px;margin-top:16px">
     <button class="btn btn-primary" onclick="toast('导出 PDF 报告（原型占位）')">导出 PDF</button>
     <button class="btn btn-ghost" onclick="archT='${t.id}';showView('tea-archive');setNavActive(document.querySelector('.nav-child[data-id=tea-archive]'))">查看质量档案</button>
     <button class="btn btn-ghost" onclick="toast('已推送至教务部待阅（站内信）')">推送教务</button></div></div></div>
  </div>`;
}

/* ============ 初始化 ============ */
const q=new URLSearchParams(location.search).get('page');
const init=q&&VIEW_NAME[q]?q:'tea-list';
showView(init);
setNavActive(document.querySelector('.nav-child[data-id="'+init+'"]'));
</script>
</body>
