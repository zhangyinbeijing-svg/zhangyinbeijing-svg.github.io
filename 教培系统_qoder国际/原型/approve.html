<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审批管理 · 干部培训学院教务管理系统 原型 V1.0</title>
<style>
:root{--primary:#1F4E79;--primary-2:#2E75B6;--success:#2E7D32;--warning:#F57F17;--danger:#C62828;
 --text:#333;--text-2:#595959;--text-3:#8a9099;--bg:#F5F6F8;--card:#fff;--line:#e5e8ec;
 --topbar-h:56px;--nav-w:220px;--nav-w-c:64px;--r:4px;--r-card:8px;--r-modal:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{text-decoration:none;color:var(--primary-2);cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:4px}
.btn{height:32px;padding:0 16px;border-radius:var(--r);font-size:14px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#173e61}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text-2)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger)}.btn-danger:hover{background:rgba(198,40,40,.06)}
.btn-text{background:none;border:none;color:var(--primary-2);cursor:pointer;font-size:13px;padding:0 4px}
.btn-text:hover{text-decoration:underline}
.btn-text.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.tag-blue{background:rgba(46,117,182,.12);color:var(--primary-2)}
.tag-green{background:rgba(46,125,50,.12);color:var(--success)}
.tag-orange{background:rgba(247,127,23,.12);color:var(--warning)}
.tag-red{background:rgba(198,40,40,.12);color:var(--danger)}
.tag-purple{background:rgba(123,80,160,.12);color:#7B50A0}
.tag-cyan{background:rgba(0,137,123,.12);color:#00897B}
.tag-gray{background:rgba(89,95,105,.1);color:var(--text-2)}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-body{padding:16px}
.input,.sel{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.input:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,121,.12)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;width:100%}
/* 顶部栏/导航 */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tb-logo{display:flex;align-items:center;gap:10px;min-width:230px}
.tb-logo .mark{width:32px;height:32px;border-radius:6px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tb-logo .name{font-size:16px;font-weight:700;white-space:nowrap}
.tb-search{flex:1;max-width:460px}.tb-search .input{width:100%;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;height:34px}
.tb-search .input::placeholder{color:rgba(255,255,255,.6)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-icon{position:relative;width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.tb-icon:hover{background:rgba(255,255,255,.15)}
.tb-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-ver{font-size:12px;color:rgba(255,255,255,.65);margin:0 4px}
.tb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.tb-user:hover{background:rgba(255,255,255,.15)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.sidenav{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:90;transition:width .2s}
.nav-parent{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;cursor:pointer;color:var(--text-2);font-size:14px;position:relative}
.nav-parent:hover{background:#f2f6fa;color:var(--primary)}
.nav-icon{width:18px;text-align:center;font-size:15px;flex:none}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-caret{font-size:11px;color:var(--text-3);transition:transform .2s}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-group.open>.nav-parent{color:var(--primary);font-weight:700}
.nav-children{display:none;background:#fafbfc}
.nav-group.open .nav-children{display:block}
.nav-child{padding:0 16px 0 44px;height:36px;display:flex;align-items:center;font-size:13px;color:var(--text-2);cursor:pointer;position:relative}
.nav-child:hover{color:var(--primary);background:#f2f6fa}
.nav-child.active{color:var(--primary);font-weight:700;background:rgba(31,78,121,.08)}
.nav-child.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.nav-collapse{border-top:1px solid var(--line);padding:12px 16px;font-size:13px;color:var(--text-3);cursor:pointer;display:flex;gap:8px;align-items:center}
body.nav-collapsed .sidenav{width:var(--nav-w-c)}
body.nav-collapsed .nav-label,body.nav-collapsed .nav-caret,body.nav-collapsed .nav-children,body.nav-collapsed .nav-collapse span{display:none}
body.nav-collapsed .nav-parent{justify-content:center;padding:0}
body.nav-collapsed .nav-collapse{justify-content:center}
.content{margin-left:var(--nav-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h));transition:margin-left .2s}
body.nav-collapsed .content{margin-left:var(--nav-w-c)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:6px}
.page-title{font-size:20px;font-weight:700}
.page-ops{display:flex;gap:8px;flex-wrap:wrap}
/* 筛选/统计/表格 */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-bar .input{width:200px}.filter-bar .sel{width:150px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#f7f9fc;border-radius:var(--r);padding:14px;text-align:center}
.stat .n{font-size:24px;font-weight:700;font-family:Consolas,monospace;color:var(--primary)}
.stat .n.g{color:var(--success)}.stat .n.o{color:var(--warning)}.stat .n.r{color:var(--danger)}
.stat .l{font-size:12px;color:var(--text-3);margin-top:2px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th,.data-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.data-table th{background:#fafbfc;color:var(--text-2);font-size:12px;font-weight:400;white-space:nowrap}
.data-table tbody tr:hover{background:#f7fafd}
.data-table .c-name{font-weight:700;color:var(--primary);cursor:pointer}
.data-table .c-name:hover{text-decoration:underline}
.sec-title{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.mini-note{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.7}
.alert{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;background:rgba(46,117,182,.07);border:1px solid rgba(46,117,182,.2);color:var(--primary);line-height:1.7}
.alert.warn{background:rgba(247,127,23,.07);border-color:rgba(247,127,23,.3);color:var(--warning)}
.sub-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.sub-tab{padding:8px 16px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.sub-tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.sub-tab .cnt{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;margin-left:4px;padding:0 4px}
/* 审批链路 */
.chain{display:flex;align-items:flex-start;margin:6px 0 4px}
.ch-step{flex:1;text-align:center;position:relative;font-size:12px}
.ch-step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.ch-step:first-child::before{display:none}
.ch-step.done::before{background:var(--success)}
.ch-step.cur::before{background:var(--success)}
.ch-dot{width:24px;height:24px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;border:2px solid var(--line);color:var(--text-3);position:relative;z-index:1}
.ch-step.done .ch-dot{background:var(--success);border-color:var(--success);color:#fff}
.ch-step.cur .ch-dot{background:#fff;border-color:var(--warning);color:var(--warning);font-weight:700}
.ch-name{color:var(--text-2);font-weight:700}
.ch-step.cur .ch-name{color:var(--warning)}
.ch-sub{color:var(--text-3);font-size:11px;line-height:1.6;margin-top:2px}
/* 金额 */
.money{font-family:Consolas,monospace;font-weight:700}
.money.over{color:var(--danger)}
/* 抽屉/Toast */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:210}
.drawer{position:fixed;top:0;right:0;bottom:0;width:640px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);z-index:220;display:flex;flex-direction:column}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{font-size:16px;font-weight:700}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.d-sec{font-size:14px;font-weight:700;margin:18px 0 10px;padding-left:8px;border-left:3px solid var(--primary)}
.d-sec:first-child{margin-top:0}
.d-grid{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}
.d-grid .k{color:var(--text-3)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(40,45,52,.92);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:300;box-shadow:var(--shadow);max-width:70%}
@media (max-width:1100px){.chain{flex-wrap:wrap}.ch-step{min-width:33%}}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-logo"><div class="mark">院</div><div class="name">干部培训学院教务管理系统</div></div>
  <div class="tb-search"><input class="input" placeholder="🔍 全局搜索：单据编号 / 标题 / 申请人…"></div>
  <div class="tb-right">
    <span class="tb-ver">V1.0 原型</span>
    <div class="tb-icon" onclick="toast('跳转消息中心（原型占位）')" title="站内信">🔔<span class="tb-badge">5</span></div>
    <div class="tb-icon" onclick="toast('帮助中心为原型占位')" title="帮助中心">❓</div>
    <div class="tb-user" id="tbUser"><div class="tb-avatar">张</div><span>张三</span><span style="font-size:10px">▼</span></div>
  </div>
</header>

<aside class="sidenav" id="sidenav"></aside>

<main class="content">
  <div class="page-head">
    <div><div class="breadcrumb" id="crumb">首页 / 审批管理 / 我的待审批</div><h2 class="page-title" id="pageTitle">我的待审批</h2></div>
    <div class="page-ops" id="pageOps"></div>
  </div>
  <div id="viewBody"></div>
</main>

<!-- 审批详情抽屉 -->
<div class="drawer-mask hidden" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer hidden" id="drawer">
  <div class="drawer-head"><h3 id="dwTitle">单据详情</h3><span class="btn-text" onclick="closeDrawer()">✕ 关闭</span></div>
  <div class="drawer-body" id="dwBody"></div>
  <div class="drawer-foot" id="dwFoot"></div>
</div>

<script>
function $(id){return document.getElementById(id)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ============ 导航（全站共享数据） ============ */
const NAV=[
 {id:'workbench',icon:'🏠',name:'工作台',direct:true},
 {id:'teach',icon:'📚',name:'教学管理',children:[{id:'teach-system',name:'课程体系',pg:'4.2-P01'},{id:'teach-course',name:'课程管理',pg:'4.2-P02'}]},
 {id:'train',icon:'🎓',name:'培训管理',children:[
   {id:'train-class',name:'培训班管理',pg:'4.3-P01'},{id:'train-stu',name:'培训考生',pg:'4.3-P03'},
   {id:'train-schedule',name:'培训排课（拖拽）',pg:'4.3-P04'},{id:'train-grade',name:'课程成绩',pg:'4.3-P06'},
   {id:'train-cert',name:'电子证书',pg:'4.3-P07'},{id:'train-eval',name:'教学评估',pg:'4.3-P08'},
   {id:'train-exam',name:'考务管理',pg:'4.3-P09'},{id:'train-cycle',name:'学员全周期',pg:'4.3-P10'},
   {id:'train-stay',name:'住宿安排',pg:'4.3-P11'},{id:'train-budget',name:'预算管理',pg:'4.3-P12'},
   {id:'train-report',name:'结班报告',pg:'4.3-P13'},{id:'train-attend',name:'考勤管理',pg:'4.3-P14'},
   {id:'train-track',name:'训后跟踪',pg:'4.3-P15'}]},
 {id:'resource',icon:'🗂️',name:'资源管理',children:[
   {id:'res-plan',name:'教案库',pg:'4.4-P01'},{id:'res-book',name:'教材库',pg:'4.4-P02'},
   {id:'res-case',name:'案例库',pg:'4.4-P03'},{id:'res-self',name:'自他资源库',pg:'4.4-P04'},
   {id:'res-bank',name:'题库试卷库',pg:'4.4-P05'},{id:'res-tag',name:'标签管理',pg:'4.4-P06'}]},
 {id:'edu',icon:'📊',name:'教务组织',children:[{id:'edu-plan',name:'教学计划管理',pg:'4.5-P01'},{id:'edu-data',name:'教务数据管理',pg:'4.5-P02'},{id:'edu-report',name:'多维度报表',pg:'4.5-P03'},{id:'edu-export',name:'数据导出与集成',pg:'4.5-P04'},{id:'edu-settle',name:'结算报告模板',pg:'4.5-P05'}]},
 {id:'teacher',icon:'👥',name:'师资库',children:[{id:'tea-list',name:'师资信息',pg:'4.6-P01'},{id:'tea-tag',name:'分级分类标签',pg:'4.6-P03'},{id:'tea-archive',name:'授课质量档案',pg:'4.6-P02'},{id:'tea-invite',name:'授课邀请函',pg:'4.6-P04'},{id:'tea-report',name:'综合评价报告',pg:'4.6-P05'}]},
 {id:'student',icon:'✪',name:'学员库',children:[{id:'stu-list',name:'学员信息',pg:'4.7-P01'},{id:'stu-query',name:'个人综合查询',pg:'4.7-P02'},{id:'stu-archive',name:'参训档案',pg:'4.7-P03'}]},
 {id:'room',icon:'🏫',name:'教室管理',children:[{id:'room-point',name:'教学点管理',pg:'4.8-P01'},{id:'room-room',name:'教室管理',pg:'4.8-P02'},{id:'room-device',name:'人脸考勤设备',pg:'4.8-P03'}]},
 {id:'approve',icon:'✅',name:'审批管理',children:[{id:'apv-schedule',name:'排课审批',pg:'4.9-P01'},{id:'apv-budget',name:'预算审批',pg:'4.9-P01'},{id:'apv-leave',name:'请假/调停课审批',pg:'4.9-P01'},{id:'apv-record',name:'审批记录',pg:'4.9-P03'}]},
 {id:'org',icon:'🏛️',name:'组织管理',children:[{id:'org-structure',name:'组织架构',pg:'4.10-P01'},{id:'org-account',name:'账户管理',pg:'4.10-P02'},{id:'org-user',name:'用户权限',pg:'4.10-P03'},{id:'org-data',name:'数据权限',pg:'4.10-P04'},{id:'org-three',name:'三员管理',pg:'4.10-P05'}]},
 {id:'base',icon:'⚙️',name:'基础设置',children:[{id:'base-category',name:'培训类别',pg:'4.11-P01'},{id:'base-course',name:'课程分类',pg:'4.11-P02'},{id:'base-log',name:'系统日志',pg:'4.11-P03'},{id:'base-rule',name:'经费规则库',pg:'4.11-P04'}]},
 {id:'screen',icon:'📈',name:'可视化大屏',children:[{id:'scr-overview',name:'总览大屏',pg:'4.12'},{id:'scr-study',name:'学情大屏',pg:'4.12'},{id:'scr-resource',name:'资源大屏',pg:'4.12'}]}
];
$('sidenav').innerHTML=NAV.map(g=>`
 <div class="nav-group ${g.id==='approve'?'open':''}" data-group="${g.id}">
   <div class="nav-parent" data-id="${g.id}"><span class="nav-icon">${g.icon}</span><span class="nav-label">${g.name}</span>${g.children?'<span class="nav-caret">▸</span>':''}</div>
   ${g.children?`<div class="nav-children">${g.children.map(c=>`<div class="nav-child" data-id="${c.id}" data-name="${c.name}" data-pg="${c.pg||''}"><span class="nav-label">${c.name}</span></div>`).join('')}</div>`:''}
 </div>`).join('')+`<div class="nav-collapse" id="navCollapse">⇤<span>收起导航</span></div>`;
$('sidenav').addEventListener('click',e=>{
  if(e.target.closest('#navCollapse')){document.body.classList.toggle('nav-collapsed');return}
  const child=e.target.closest('.nav-child'),parent=e.target.closest('.nav-parent');
  if(child){
    const id=child.dataset.id,pg=child.dataset.pg||'';
    if(pg.indexOf('4.9')===0){showView(id);setNavActive(child);return}
        if(pg.indexOf('4.10')===0){location.href='org.html?page='+id;return}
        if(pg.indexOf('4.12')===0){location.href='screen.html?scr='+id;return}
    if(id==='train-schedule'){location.href='training-schedule.html';return}
    if(pg.indexOf('4.2')===0){location.href='teaching.html?page='+id;return}
    if(pg.indexOf('4.3')===0){location.href='training.html?page='+id;return}
    if(pg.indexOf('4.4')===0){location.href='resource.html?page='+id;return}
    if(pg.indexOf('4.5')===0){location.href='edu.html?page='+id;return}
    if(pg.indexOf('4.6')===0){location.href='teacher-lib.html?page='+id;return}
    if(pg.indexOf('4.7')===0){location.href='student-lib.html?page='+id;return}
    if(pg.indexOf('4.8')===0){location.href='room.html?page='+id;return}
    toast('「'+child.dataset.name+'」（'+pg+'）为原型占位');return}
  if(parent){const g=NAV.find(x=>x.id===parent.dataset.id);
    if(g.direct){location.href='workbench.html';return}
    parent.closest('.nav-group').classList.toggle('open');}
});
function setNavActive(el){document.querySelectorAll('.nav-child').forEach(n=>n.classList.remove('active'));el&&el.classList.add('active')}
$('tbUser').onclick=()=>toast('个人信息 / 修改密码见 workbench.html 账户入口');

/* ============ 单据数据（V3.2 五-(一)-8 / PRD 4.9，当前用户：张三 · 二级管理员[处领导]，兼演示申请人） ============ */
const ME='张三';
const ST_CLS={'审核中':'tag-orange','已排课':'tag-green','已通过':'tag-green','审批驳回':'tag-red','已驳回':'tag-red','已作废':'tag-gray','已撤销':'tag-gray'};
const TYPE_CLS={'排课审批':'tag-blue','预算审批':'tag-purple','请假审批':'tag-cyan','调停课审批':'tag-orange','开结班审批':'tag-green'};
const LOCK={'预锁定':'tag-orange','正式锁定':'tag-green','已释放':'tag-gray','无需锁定':'tag-gray'};

let curView='apv-schedule',mainTab='todo',todoType='全部',recFilter={type:'',status:''};
const VIEW_NAME={'apv-schedule':'排课审批','apv-budget':'预算审批','apv-leave':'请假/调停课审批','apv-record':'审批记录'};

function showView(id){
  curView=id;
  if(id==='apv-schedule'){mainTab='todo';todoType='排课审批'}
  else if(id==='apv-budget'){mainTab='todo';todoType='预算审批'}
  else if(id==='apv-leave'){mainTab='todo';todoType='请假/调停课'}
  else if(id==='apv-record'){mainTab='record'}
  syncHead();render();
}
function syncHead(){
  const tName=mainTab==='todo'?'我的待审批':mainTab==='mine'?'我提交的':'审批记录';
  $('crumb').textContent='首页 / 审批管理 / '+tName;
  $('pageTitle').textContent=tName+(mainTab==='todo'&&todoType!=='全部'?' · '+todoType:'');
  $('pageOps').innerHTML=mainTab==='record'
    ?'<button class="btn btn-primary" onclick="toast(\'已创建导出任务：全量审批日志（原型占位）\')">导出审批日志</button>'
    :'<button class="btn btn-ghost" onclick="toast(\'待办已同步至工作台，办结自动消除并推送通知（原型占位）\')">同步至工作台</button>';
}
function switchTab(t){mainTab=t;if(t==='todo')todoType='全部';syncHead();render()}
function render(){
  const b=$('viewBody');
  if(mainTab==='todo')b.innerHTML=vTodo();
  else if(mainTab==='mine')b.innerHTML=vMine();
  else b.innerHTML=vRecord();
}
function findB(id){return BILLS.find(x=>x.id===id)}
function stTag(s){return `<span class="tag ${ST_CLS[s]||'tag-gray'}">${s}</span>`}
function todoOf(b){return b.status==='审核中'&&b.cur==='二级审批'&&!b.mine}
function chainHtml(b){
  return `<div class="chain">${b.chain.map(c=>{
    if(c.s==='skip')return `<div class="ch-step"><div class="ch-dot">—</div><div class="ch-name" style="color:var(--text-3)">${c.n}</div><div class="ch-sub">${c.op||'无需此环节'}</div></div>`;
    const cls=c.s==='done'?'done':c.s==='cur'?'cur':'';
    const icon=c.s==='done'?'✓':c.s==='cur'?'●':'○';
    return `<div class="ch-step ${cls}"><div class="ch-dot">${icon}</div><div class="ch-name">${c.n}</div><div class="ch-sub">${c.u||''}${c.t?'<br>'+c.t:''}</div>${c.op?`<div class="ch-sub" style="margin-top:2px">${c.op}</div>`:''}</div>`;
  }).join('')}</div>`;
}

/* ============ 4.9-P01 我的待审批 ============ */
function vTodo(){
  const todos=BILLS.filter(todoOf);
  const tType=todoType==='请假/调停课'?todos.filter(b=>b.type==='请假审批'||b.type==='调停课审批'):todos.filter(b=>b.type===todoType||todoType==='全部');
  const cnt=t=>t==='全部'?todos.length:t==='请假/调停课'?todos.filter(b=>b.type==='请假审批'||b.type==='调停课审批').length:todos.filter(b=>b.type===t).length;
  const stats=`<div class="stat-cards">
   <div class="stat"><div class="n o">${todos.length}</div><div class="l">待我审批</div></div>
   <div class="stat"><div class="n">${todos.filter(b=>b.type==='排课审批').length}</div><div class="l">排课审批</div></div>
   <div class="stat"><div class="n">${todos.filter(b=>b.type==='预算审批').length}</div><div class="l">预算审批</div></div>
   <div class="stat"><div class="n">${todos.filter(b=>b.type==='请假审批'||b.type==='调停课审批').length}</div><div class="l">请假/调停课</div></div>
   <div class="stat"><div class="n g">${BILLS.filter(b=>!todoOf(b)&&b.chain.some(c=>c.u===ME&&c.s==='done')).length}</div><div class="l">我已办结（累计）</div></div></div>`;
  const tabs=`<div class="sub-tabs">
   ${['todo','mine','record'].map(t=>`<div class="sub-tab ${mainTab===t?'active':''}" onclick="switchTab('${t}')">${t==='todo'?'我的待审批':t==='mine'?'我提交的':'审批记录'}${t==='todo'&&todos.length?`<span class="cnt">${todos.length}</span>`:''}</div>`).join('')}
   <span style="flex:1"></span>
   ${['全部','排课审批','预算审批','请假/调停课'].map(t=>`<div class="sub-tab ${todoType===t?'active':''}" style="font-size:12px;padding:8px 10px" onclick="todoType='${t}';render()">${t}(${cnt(t)})</div>`).join('')}</div>`;
  const rows=`<div class="card"><div class="card-body">
   <div class="alert">✅ 内置标准审批流程：三级管理员提交 → 二级审批员（处领导）审核 → 大额预算/全院事项追加一级审批（院领导），不支持自定义配置。审批中单据各环节状态实时可查，记录留存备查。</div>
   <table class="data-table"><thead><tr><th>单据编号</th><th>类型</th><th>标题</th><th>申请人</th><th>提交时间</th><th>当前节点</th><th>资源锁定</th><th>状态</th><th>操作</th></tr></thead><tbody>
   ${tType.map(b=>`<tr><td class="c-name" onclick="openBill('${b.id}')">${b.id}</td>
    <td><span class="tag ${TYPE_CLS[b.type]}">${b.type}</span></td>
    <td style="max-width:260px">${b.title}</td><td>${b.applicant}<br><span style="font-size:11px;color:var(--text-3)">${b.dept}</span></td>
    <td>${b.time}</td><td><span class="tag tag-orange">${b.cur}</span></td>
    <td><span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span></td>
    <td>${stTag(b.status)}</td>
    <td><button class="btn-text" onclick="openBill('${b.id}')">审批</button></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;color:var(--text-3);padding:32px">🎉 该类型暂无待审批单据</td></tr>'}
   </tbody></table></div></div>`;
  return stats+tabs+rows;
}

/* ============ 4.9-P02 我提交的 ============ */
function vMine(){
  const mine=BILLS.filter(b=>b.mine);
  const tabs=`<div class="sub-tabs">
   ${['todo','mine','record'].map(t=>`<div class="sub-tab ${mainTab===t?'active':''}" onclick="switchTab('${t}')">${t==='todo'?'我的待审批':t==='mine'?'我提交的':'审批记录'}${t==='mine'?`<span class="cnt" style="background:var(--primary-2)">${mine.length}</span>`:''}</div>`).join('')}</div>`;
  const cards=mine.map(b=>`<div class="card" style="margin-bottom:12px"><div class="card-body">
   <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
    <b class="c-name" style="cursor:pointer;color:var(--primary)" onclick="openBill('${b.id}')">${b.id}</b>
    <span class="tag ${TYPE_CLS[b.type]}">${b.type}</span>${stTag(b.status)}
    <span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span>
    <span style="font-size:12px;color:var(--text-3);margin-left:auto">提交于 ${b.time}</span></div>
   <div style="font-size:13px;margin-bottom:10px">${b.title}</div>
   ${chainHtml(b)}
   <div style="display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap">
    <button class="btn-text" onclick="openBill('${b.id}')">详情</button>
    ${b.status==='审核中'?`<button class="btn-text" onclick="toast('已催办：站内信+短信通知当前审批人（原型占位）')">催办</button>
     <button class="btn-text danger" onclick="doWithdraw('${b.id}')">撤销申请</button>`:''}
    ${b.status==='审批驳回'?`<button class="btn-text" onclick="toast('修改排课/预算信息后重新提交，再次预锁资源（原型占位）')">修改重提</button>
     <button class="btn-text danger" onclick="doVoid('${b.id}')">作废单据</button>`:''}
    ${b.status==='已排课'?`<button class="btn-text" onclick="toast('调课：重新发起排课申请，原单据作废（原型占位）')">发起调课</button>
     <button class="btn-text danger" onclick="doVoid('${b.id}')">停课作废</button>`:''}
    ${b.status==='已作废'||b.status==='已通过'||b.status==='已驳回'?`<span class="mini-note" style="margin:0">单据留存可溯源，台账核对可查</span>`:''}
   </div></div></div>`).join('');
  return tabs+(cards||'<div class="card"><div class="card-body" style="text-align:center;color:var(--text-3);padding:40px">暂无我提交的单据</div></div>');
}

/* ============ 4.9-P03 审批记录 ============ */
function vRecord(){
  const tabs=`<div class="sub-tabs">
   ${['todo','mine','record'].map(t=>`<div class="sub-tab ${mainTab===t?'active':''}" onclick="switchTab('${t}')">${t==='todo'?'我的待审批':t==='mine'?'我提交的':'审批记录'}</div>`).join('')}</div>`;
  const list=BILLS.filter(b=>(!recFilter.type||b.type===recFilter.type)&&(!recFilter.status||b.status===recFilter.status));
  const rows=`<div class="card"><div class="card-body">
   <div class="filter-bar">
    <input class="input" placeholder="单据编号/标题/申请人检索，回车确认…" onkeydown="if(event.key==='Enter')toast('检索：'+this.value.trim()+'（原型占位）')">
    <select class="sel" onchange="recFilter.type=this.value;render()"><option value="">全部类型</option>${Object.keys(TYPE_CLS).map(t=>`<option ${recFilter.type===t?'selected':''}>${t}</option>`).join('')}</select>
    <select class="sel" onchange="recFilter.status=this.value;render()"><option value="">全部状态</option>${['审核中','已排课','已通过','审批驳回','已驳回','已作废'].map(s=>`<option ${recFilter.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <button class="btn btn-ghost" onclick="recFilter.type='';recFilter.status='';render()">重置</button>
    <span style="font-size:12px;color:var(--text-3);margin-left:auto">全量审批日志 ${list.length} 条；含撤销/作废留存记录，支持溯源与台账核对</span></div>
   <table class="data-table"><thead><tr><th>单据编号</th><th>类型</th><th>标题</th><th>申请人</th><th>提交时间</th><th>审批链路</th><th>资源锁定</th><th>状态</th><th>操作</th></tr></thead><tbody>
   ${list.map(b=>`<tr><td class="c-name" onclick="openBill('${b.id}')">${b.id}</td>
    <td><span class="tag ${TYPE_CLS[b.type]}">${b.type}</span></td>
    <td style="max-width:240px">${b.title}</td><td>${b.applicant}</td><td>${b.time}</td>
    <td style="font-size:12px;color:var(--text-2)">${b.chain.filter(c=>c.s==='done').map(c=>c.n).join(' → ')}${b.cur!=='—'?' → <b style="color:var(--warning)">'+b.cur+'</b>':''}</td>
    <td><span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span></td>
    <td>${stTag(b.status)}</td>
    <td><button class="btn-text" onclick="openBill('${b.id}')">详情</button></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;color:var(--text-3);padding:32px">无匹配记录</td></tr>'}
   </tbody></table></div></div>`;
  return tabs+rows;
}

/* ============ 审批详情抽屉（PRD 3.3.4 审批页模板） ============ */
function openBill(id){
  const b=findB(id);if(!b)return;
  $('dwTitle').innerHTML=b.id+' · '+b.type;
  let extra='';
  if(b.res){extra=`<div class="d-sec">关联资源占用预览</div>
   <div class="d-grid"><span class="k">课程</span><span>${b.res.course}</span>
    <span class="k">班次</span><span>${b.res.cls}（${b.res.stu} 人）</span>
    <span class="k">上课时间</span><span>${b.res.slot}</span>
    <span class="k">教师</span><span>${b.res.teacher}</span>
    <span class="k">教室</span><span>${b.res.room}</span>
    <span class="k">资源锁定</span><span><span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span>　${b.lock==='预锁定'?'提交即预锁定，全局不可复用；通过后转正式锁定，驳回/撤回/作废自动释放':''}</span></div>`}
  else if(b.budget){extra=`<div class="d-sec">预算明细与合规校验</div>
   <table class="data-table"><thead><tr><th>科目</th><th>金额</th><th>校验</th></tr></thead><tbody>
   ${b.budget.items.map(it=>{const over=it[2].indexOf('超')>=0;return `<tr><td>${it[0]}</td><td class="money ${over?'over':''}">¥${it[1].toLocaleString()}</td><td>${over?'<span class="tag tag-red">'+it[2]+'</span>':'<span class="tag tag-green">'+it[2]+'</span>'}</td></tr>`}).join('')}
   <tr><td><b>合计</b></td><td class="money">¥${b.budget.amount.toLocaleString()}</td><td></td></tr></tbody></table>
   <div class="alert ${b.budget.check.indexOf('通过')<0?'warn':''}" style="margin:10px 0 0">${b.budget.check.indexOf('通过')>=0?'✅':'⚠️'} ${b.budget.check}　·　${b.budget.level}</div>`}
  else if(b.leave){extra=`<div class="d-sec">申请信息摘要</div>
   <div class="d-grid"><span class="k">对象</span><span>${b.leave.stu}</span>
    <span class="k">时间范围</span><span>${b.leave.range}</span>
    <span class="k">事由</span><span>${b.leave.reason}</span>
    <span class="k">业务影响</span><span>${b.leave.impact}</span></div>`}
  else if(b.adjust){extra=`<div class="d-sec">调停课信息</div>
   <div class="d-grid"><span class="k">操作类型</span><span><span class="tag tag-orange">${b.adjust.act}</span></span>
    <span class="k">原课时安排</span><span>${b.adjust.old}</span>
    <span class="k">原因</span><span>${b.adjust.reason}</span>
    <span class="k">资源影响</span><span>${b.adjust.effect}</span></div>`}
  const canApprove=todoOf(b);
  $('dwBody').innerHTML=`
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">${stTag(b.status)}<span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span>
    <span style="font-size:12px;color:var(--text-3)">当前节点：${b.cur}</span></div>
   <div class="d-sec" style="margin-top:0">申请信息</div>
   <div class="d-grid"><span class="k">单据编号</span><span><b>${b.id}</b></span>
    <span class="k">标题</span><span>${b.title}</span>
    <span class="k">申请人</span><span>${b.applicant}（${b.dept}）</span>
    <span class="k">提交时间</span><span>${b.time}</span></div>
   ${extra}
   <div class="d-sec">审批链路（实时可查 · 留存备查）</div>
   ${chainHtml(b)}
   ${canApprove?`<div class="d-sec">审批意见 <span style="color:var(--danger);font-size:12px">（通过/驳回均需填写，驳回必填原因）</span></div>
   <textarea class="input" id="opText" rows="3" placeholder="请输入审批意见…"></textarea>`:''}`;
  let foot=`<button class="btn btn-ghost" onclick="closeDrawer()">关闭</button>`;
  if(canApprove){
    foot+=`<button class="btn btn-ghost" onclick="toast('更换审批人：由系统管理员操作并留痕（原型占位）')">更换审批人</button>
     <button class="btn btn-danger" onclick="doApprove('${b.id}',false)">驳回</button>
     <button class="btn btn-primary" onclick="doApprove('${b.id}',true)">通过</button>`;
  }else if(b.mine&&b.status==='审核中'){
    foot+=`<button class="btn btn-ghost" onclick="toast('已催办：通知当前审批人（原型占位）')">催办</button>
     <button class="btn btn-danger" onclick="doWithdraw('${b.id}')">撤销申请</button>`;
  }else if(b.status==='已排课'){
    foot+=`<button class="btn btn-ghost" onclick="toast('调课：重新发起排课申请，原单据作废（原型占位）')">发起调课</button>
     <button class="btn btn-danger" onclick="doVoid('${b.id}')">停课作废</button>`;
  }
  $('dwFoot').innerHTML=foot;
  $('drawerMask').classList.remove('hidden');$('drawer').classList.remove('hidden');
}
function closeDrawer(){$('drawerMask').classList.add('hidden');$('drawer').classList.add('hidden')}
function nowStr(){return '2026-09-25 14:0'+Math.floor(Math.random()*10)}
function doApprove(id,pass){
  const b=findB(id),op=($('opText')?$('opText').value.trim():'');
  if(!op){toast('请填写审批意见（驳回必填原因）');return}
  const node=b.chain.find(c=>c.s==='cur');
  if(node){node.s='done';node.t=nowStr();node.op=(pass?'同意。':'驳回：')+op}
  b.cur='—';
  if(pass){
    if(b.type==='排课审批'){b.status='已排课';b.lock='正式锁定';toast(b.id+' 已排课：资源转正式锁定，同步班级/教师/教室三课表，已通知申请人')}
    else if(b.type==='调停课审批'){b.status='已通过';b.lock='已释放';toast('停课已通过：原课时资源已释放，原排课单作废留存')}
    else{b.status='已通过';toast(b.id+' 审批通过'+(b.type==='预算审批'?'，预算锁定为报销控制基线':'')+'，已通知申请人')}
  }else{
    if(b.type==='排课审批'){b.status='审批驳回';b.lock='已释放';toast('已驳回：预锁定资源自动释放，教师/教室恢复空闲，已通知申请人')}
    else{b.status='已驳回';if(b.type==='调停课审批')b.lock='正式锁定';toast('已驳回，已通知申请人')}
  }
  closeDrawer();render();
}
function doWithdraw(id){
  const b=findB(id);
  if(!confirm('确认撤销「'+b.id+'」？撤销后对应教师/教室预锁定资源将解除。'))return;
  const node=b.chain.find(c=>c.s==='cur');if(node){node.s='skip';node.op='申请人已撤销'}
  b.status='已作废';b.lock='已释放';b.cur='—';
  b.chain.push({n:'撤回',u:ME,s:'done',t:nowStr(),op:'主动撤回申请，单据作废留存，全部资源已释放'});
  closeDrawer();render();toast('已撤销：资源解锁，单据留存可溯源');
}
function doVoid(id){
  const b=findB(id);
  if(!confirm('确认作废「'+b.id+'」？作废后锁定资源将全额释放，单据留存日志。'))return;
  b.status='已作废';b.lock='已释放';b.cur='—';
  b.chain.push({n:'作废',u:ME,s:'done',t:nowStr(),op:'单据作废，师资/教室资源恢复空闲'});
  closeDrawer();render();toast('单据已作废，资源已释放，留存日志可溯源');
}

/* ============ 初始化 ============ */
const q=new URLSearchParams(location.search).get('page');
const init=q&&VIEW_NAME[q]?q:'apv-schedule';
showView(init);
setNavActive(document.querySelector('.nav-child[data-id="'+init+'"]'));
</script>
</body>
