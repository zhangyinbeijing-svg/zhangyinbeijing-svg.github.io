<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="stylesheet" href="common.css">
<script src="store.js"></script>
<script src="common.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审批管理 · 干部**学院教务管理系统 原型 V1.0</title>
<style>
:root{
  --primary:#1F4E79;--primary-2:#2E75B6;--primary-light:#eef4fa;
  --success:#2E7D32;--warning:#F57F17;--danger:#C62828;--info:#0288D1;
  --text:#2c3e50;--text-2:#595959;--text-3:#8a9099;--bg:#F5F6F8;--card:#fff;--line:#e5e8ec;
  --topbar-h:56px;--nav-w:160px;--nav-w-c:48px;--r:4px;--r-card:8px;--r-modal:12px;--shadow:0 2px 8px rgba(0,0,0,.08);
  --stamp-red:#c62828;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
a{text-decoration:none;color:var(--primary-2);cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:4px}
.btn{height:32px;padding:0 16px;border-radius:var(--r);font-size:13px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#173e61}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text-2)}.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger)}.btn-danger:hover{background:rgba(198,40,40,.06)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#236327}
.btn-text{background:none;border:none;color:var(--primary-2);cursor:pointer;font-size:13px;padding:0 4px}
.btn-text:hover{text-decoration:underline}
.btn-text.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap;font-weight:500}
.tag-blue{background:rgba(46,117,182,.12);color:var(--primary-2)}
.tag-green{background:rgba(46,125,50,.12);color:var(--success)}
.tag-orange{background:rgba(247,127,23,.12);color:var(--warning)}
.tag-red{background:rgba(198,40,40,.12);color:var(--danger)}
.tag-purple{background:rgba(123,80,160,.12);color:#7B50A0}
.tag-cyan{background:rgba(0,137,123,.12);color:#00897B}
.tag-gray{background:rgba(89,95,105,.1);color:var(--text-2)}

.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-body{padding:18px}
.input,.sel{height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--text)}
.input:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,121,.12)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;width:100%}

/* 顶部栏/导航 */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tb-logo{display:flex;align-items:center;gap:10px;min-width:230px}
.tb-logo .mark{width:32px;height:32px;border-radius:6px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tb-logo .name{font-size:16px;font-weight:700;white-space:nowrap}
.tb-search{flex:1;max-width:460px}.tb-search .input{width:100%;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff;height:34px}
.tb-search .input::placeholder{color:rgba(255,255,255,.6)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-icon{position:relative;width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.tb-icon:hover{background:rgba(255,255,255,.15)}
.tb-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-ver{font-size:12px;color:rgba(255,255,255,.65);margin:0 4px}
.tb-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:var(--r)}
.tb-user:hover{background:rgba(255,255,255,.15)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}

.sidenav{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:90;transition:width .2s}
.nav-parent{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;cursor:pointer;color:var(--text-2);font-size:13px;position:relative}
.nav-parent:hover{background:#f2f6fa;color:var(--primary)}
.nav-icon{width:18px;text-align:center;font-size:15px;flex:none}
.nav-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-caret{font-size:11px;color:var(--text-3);transition:transform .2s}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-group.open>.nav-parent{color:var(--primary);font-weight:700}
.nav-children{display:none;background:#fafbfc}
.nav-group.open .nav-children{display:block}
.nav-child{padding:0 10px 0 32px;height:30px;display:flex;align-items:center;font-size:12.5px;color:var(--text-2);cursor:pointer;position:relative}
.nav-child:hover{color:var(--primary);background:#f2f6fa}
.nav-child.active{color:var(--primary);font-weight:700;background:rgba(31,78,121,.08)}
.nav-child.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}

.content{margin-left:var(--nav-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h));transition:margin-left .2s}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--text-3);margin-bottom:6px}
.page-title{font-size:20px;font-weight:700;color:var(--text)}
.page-ops{display:flex;gap:8px;flex-wrap:wrap}

/* 统计卡与 Tab 样式 */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:var(--r-card);padding:14px 16px;text-align:center;box-shadow:var(--shadow);border:1px solid #edf1f5;cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat.active{border-color:var(--primary);background:var(--primary-light)}
.stat .n{font-size:22px;font-weight:700;font-family:Consolas,monospace;color:var(--primary)}
.stat .n.g{color:var(--success)}.stat .n.o{color:var(--warning)}.stat .n.r{color:var(--danger)}.stat .n.p{color:#7B50A0}.stat .n.c{color:#00897B}
.stat .l{font-size:12px;color:var(--text-3);margin-top:3px}

.sub-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sub-tab{padding:8px 16px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.sub-tab:hover{color:var(--primary)}
.sub-tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.sub-tab .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:0 5px}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-bar .input{width:220px}.filter-bar .sel{width:140px}

/* 数据表格 */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th,.data-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.data-table th{background:#fafbfc;color:var(--text-2);font-size:12px;font-weight:600;white-space:nowrap}
.data-table tbody tr:hover{background:#f7fafd}
.data-table .c-name{font-weight:700;color:var(--primary-2);cursor:pointer}
.data-table .c-name:hover{text-decoration:underline}
.cell-ellipsis{display:block;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;cursor:pointer;transition:color .15s}
.cell-ellipsis:hover{color:var(--primary-2);text-decoration:underline}
.floating-tooltip{position:fixed;background:rgba(15,23,42,.94);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;line-height:1.5;max-width:450px;word-break:break-all;z-index:99999;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .15s ease-out,transform .15s ease-out;display:none;opacity:0;transform:translateY(2px);backdrop-filter:blur(4px)}
.floating-tooltip.show{display:block;opacity:1;transform:translateY(0)}

.alert{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;background:rgba(46,117,182,.07);border:1px solid rgba(46,117,182,.2);color:var(--primary);line-height:1.7}
.alert.warn{background:rgba(247,127,23,.07);border-color:rgba(247,127,23,.3);color:var(--warning)}
.alert.success{background:rgba(46,125,50,.07);border-color:rgba(46,125,50,.25);color:var(--success)}
.alert.danger{background:rgba(198,40,40,.07);border-color:rgba(198,40,40,.25);color:var(--danger)}

/* 审批链路 */
.chain{display:flex;align-items:flex-start;margin:8px 0 6px}
.ch-step{flex:1;text-align:center;position:relative;font-size:12px}
.ch-step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.ch-step:first-child::before{display:none}
.ch-step.done::before{background:var(--success)}
.ch-step.cur::before{background:var(--success)}
.ch-dot{width:24px;height:24px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;border:2px solid var(--line);color:var(--text-3);position:relative;z-index:1}
.ch-step.done .ch-dot{background:var(--success);border-color:var(--success);color:#fff}
.ch-step.cur .ch-dot{background:#fff;border-color:var(--warning);color:var(--warning);font-weight:700;box-shadow:0 0 0 3px rgba(245,127,23,.18)}
.ch-name{color:var(--text-2);font-weight:700}
.ch-step.cur .ch-name{color:var(--warning)}
.ch-sub{color:var(--text-3);font-size:11px;line-height:1.5;margin-top:2px}

/* 抽屉与大模态 */
.drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:210}
.drawer{position:fixed;top:0;right:0;bottom:0;width:660px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.18);z-index:220;display:flex;flex-direction:column}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fafbfc}
.drawer-head h3{font-size:16px;font-weight:700;color:var(--primary)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:#fafbfc}

.d-sec{font-size:13.5px;font-weight:700;margin:18px 0 10px;padding-left:8px;border-left:3px solid var(--primary);color:var(--primary);display:flex;align-items:center;justify-content:space-between}
.d-sec:first-child{margin-top:0}
.d-grid{display:grid;grid-template-columns:105px 1fr;gap:8px 12px;font-size:13px}
.d-grid .k{color:var(--text-3)}

/* ================= 专属公文审签大单据模态框 (Page Modal) ================= */
.doc-modal{position:fixed;top:40px;bottom:40px;left:50%;transform:translateX(-50%);width:960px;max-width:96vw;background:#fff;border-radius:12px;box-shadow:0 12px 48px rgba(0,0,0,.28);z-index:230;display:flex;flex-direction:column;overflow:hidden;border:1px solid #d0d7de}
.doc-modal-head{background:linear-gradient(180deg,#ffffff,#f7f9fb);border-bottom:1px solid #e1e4e8;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.doc-modal-head .title-box{display:flex;align-items:center;gap:12px}
.doc-modal-head .badge-type{padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:1px}
.doc-modal-body{flex:1;overflow-y:auto;padding:28px 36px;background:#fafbfc}
.doc-modal-foot{padding:14px 24px;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}

/* 红头公文纸质感 */
.paper-sheet{background:#fff;border:1px solid #e1e6eb;border-radius:8px;padding:32px 36px;box-shadow:0 3px 12px rgba(0,0,0,.04);position:relative}
.red-header{text-align:center;margin-bottom:24px;position:relative}
.red-header .inst-name{font-size:24px;font-weight:800;color:#c62828;letter-spacing:3px;font-family:"SimSun","Songti SC",serif}
.red-header .doc-kind{font-size:20px;font-weight:700;color:#1F4E79;letter-spacing:2px;margin-top:6px}
.red-header .doc-meta-row{display:flex;justify-content:space-between;border-bottom:2px solid #c62828;padding-bottom:10px;margin-top:18px;font-size:12px;color:var(--text-2)}

/* 骑缝印章与防伪章 */
.stamp-seal{position:absolute;top:28px;right:40px;width:105px;height:105px;border:3px solid var(--stamp-red);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--stamp-red);font-weight:800;transform:rotate(-15deg);opacity:.85;pointer-events:none;background:rgba(255,255,255,.7);box-shadow:0 0 0 2px var(--stamp-red) inset;text-shadow:0 0 1px rgba(198,40,40,.3)}
.stamp-seal .s-sub{font-size:10px;letter-spacing:1px}
.stamp-seal .s-main{font-size:15px;margin:3px 0;letter-spacing:2px}
.stamp-seal .s-star{font-size:12px}

/* 公文表单格 */
.doc-table{width:100%;border-collapse:collapse;border:1px solid #2b2b2b;margin-bottom:20px;font-size:13px}
.doc-table td,.doc-table th{border:1px solid #d3d9df;padding:10px 14px}
.doc-table .field-label{background:#f4f7fa;font-weight:600;color:#333;width:125px;text-align:right}
.doc-table .field-val{background:#fff;color:#1a1a1a}

/* 模块专属卡片 */
.spec-box{border-radius:6px;border:1px solid #d5e2ef;background:#fff;padding:16px;margin:16px 0}
.spec-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* 对比卡片（调课前后） */
.compare-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:12px;align-items:center;margin:12px 0}
.compare-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:14px}
.compare-box.after{background:#f0fdf4;border-color:#bbf7d0}
.compare-arrow{text-align:center;font-size:22px;color:var(--primary-2);font-weight:700}

/* 考勤仪表/学时红线 */
.leave-gauge{display:flex;align-items:center;gap:16px;background:#fff8e6;border:1px solid #ffe082;border-radius:6px;padding:14px;margin:12px 0}
.gauge-circle{width:60px;height:60px;border-radius:50%;background:#fff;border:4px solid var(--warning);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--warning);flex:none}
.gauge-circle.safe{border-color:var(--success);color:var(--success)}
.gauge-circle.danger{border-color:var(--danger);color:var(--danger)}

/* 快速批示评语条 */
.quick-ops{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick-chip{background:#eef4fa;border:1px solid #cbdde9;color:var(--primary);border-radius:4px;padding:3px 10px;font-size:12px;cursor:pointer;transition:all .15s}
.quick-chip:hover{background:var(--primary);color:#fff}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(40,45,52,.92);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:350;box-shadow:var(--shadow);max-width:70%}
@media (max-width:1100px){.doc-modal{width:98vw;top:10px;bottom:10px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-logo"><div class="mark">院</div><div class="name">干部**学院教务管理系统</div></div>
  <div class="tb-search"><input class="input" placeholder="🔍 全局搜索：审批单据 / 培训班次 / 授课专家 / 申请人…"></div>
  <div class="tb-right">
    <span class="tb-ver">V1.0 原型</span>
    <div class="tb-icon" onclick="location.href='notice.html'" title="通知与待办中心">🔔<span class="tb-badge">6</span></div>
    <div class="tb-icon" onclick="toast('帮助文档请参阅《教务系统详细需求文档PRD V1.0》', 'info')" title="帮助中心">❓</div>
    <div class="tb-user" id="tbUser"><div class="tb-avatar">张</div><span>张三（处领导·二级审批员）</span><span style="font-size:10px">▼</span></div>
  </div>
</header>

<aside class="sidenav" id="sidenav"></aside>

<main class="content">
  <div class="page-head">
    <div>
      <div class="breadcrumb" id="crumb">首页 / 审批管理 / 我的审批 / 我的待审批</div>
      <h2 class="page-title" id="pageTitle">我的审批 · 我的待审批</h2>
    </div>
    <div class="page-ops" id="pageOps"></div>
  </div>
  <div id="viewBody"></div>
</main>

<!-- 普通滑动抽屉（轻量查看） -->
<div class="drawer-mask hidden" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer hidden" id="drawer">
  <div class="drawer-head"><h3 id="dwTitle">单据详情</h3><span class="btn-text" onclick="closeDrawer()">✕ 关闭</span></div>
  <div class="drawer-body" id="dwBody"></div>
  <div class="drawer-foot" id="dwFoot"></div>
</div>

<!-- ================= 全功能专属公文审签大单据页面/模态框 ================= -->
<div class="drawer-mask hidden" id="docMask" onclick="closeDocModal()"></div>
<div class="doc-modal hidden" id="docModal">
  <div class="doc-modal-head">
    <div class="title-box">
      <span class="badge-type" id="docBadgeType">排课审批</span>
      <h3 style="font-size:17px;font-weight:700;color:#1F4E79" id="docHeadTitle">干部**学院审批呈批单</h3>
      <span style="font-size:12px;color:var(--text-3);margin-left:8px" id="docCode">PK-2026-0921</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-ghost" style="height:28px;font-size:12px" onclick="window.print()">🖨️ 打印呈批表</button>
      <span class="btn-text" style="font-size:16px;cursor:pointer" onclick="closeDocModal()">✕</span>
    </div>
  </div>
  <div class="doc-modal-body" id="docBody"></div>
  <div class="doc-modal-foot" id="docFoot"></div>
</div>

<script>
function $(id){return document.getElementById(id)}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

/* ============ 导航配置（全站统一，含5类审批+全周期记录） ============ */
const NAV=[
 {id:'workbench',icon:'🏠',name:'工作台',direct:true},
 {id:'teach',icon:'📚',name:'教学管理',children:[{id:'teach-system',name:'课程体系',pg:'4.2-P01'},{id:'teach-course',name:'课程管理',pg:'4.2-P02'}]},
 {id:'train',icon:'🎓',name:'培训管理',children:[{id:'train-class',name:'培训班管理',pg:'4.3-P01'},{id:'base-category',name:'培训类别',pg:'4.2-P04'}]},
 {id:'resource',icon:'🗂️',name:'资源管理',children:[
   {id:'res-plan',name:'教案库',pg:'4.4-P01'},{id:'res-book',name:'教材库',pg:'4.4-P02'},

}

function showView(id){
  curView=id;
  if(id==='apv-record'){
    mainTab='record';
  } else if(id==='apv-my'){
    if(mainTab==='record') mainTab='todo';
    todoType='全部';
  } else {
    if(mainTab==='record') mainTab='todo';
    todoType=VIEW_MAP[id]||'全部';
  }
  syncHead();
  render();
}

function syncHead(){
  if(curView==='apv-record'||mainTab==='record'){
    $('crumb').textContent='首页 / 审批管理 / 审批记录';
    $('pageTitle').textContent='审批记录';
    $('pageOps').innerHTML='<button class="btn btn-primary" onclick="toast(\'已导出全周期审批单据台账Excel包（含审批链路留痕）\')">📥 导出审批台账</button>';
  } else if(curView==='apv-my'||todoType==='全部'){
    const subTitle=mainTab==='mine'?'我提交的':'我的待审批';
    $('crumb').textContent='首页 / 审批管理 / 我的审批 / '+subTitle;
    $('pageTitle').textContent='我的审批 · '+subTitle;
    $('pageOps').innerHTML='';
  } else {
    const tName=VIEW_MAP[curView]||todoType;
    const subTitle=mainTab==='mine'?'我提交的':'待我审批';
    $('crumb').textContent='首页 / 审批管理 / '+tName;
    $('pageTitle').textContent=tName+' · '+subTitle;
    $('pageOps').innerHTML='';
  }
}

function switchTab(t){
  mainTab=t;
  if(t==='record'){
    showView('apv-record');
    return;
  }
  if(curView==='apv-record'){
    curView='apv-my';
    setNavActive(document.querySelector('.nav-child[data-id="apv-my"]'));
  }
  syncHead();
  render();
}

function render(){
  const b=$('viewBody');
  if(mainTab==='todo')b.innerHTML=vTodo();
  else if(mainTab==='mine')b.innerHTML=vMine();
  else b.innerHTML=vRecord();
  try {
    const todoCount = BILLS.filter(todoOf).length;
    if (typeof updateNavApprovalBadge === 'function') {
      updateNavApprovalBadge(todoCount);
    }
  } catch(e) {}
}

function findB(id){return BILLS.find(x=>x.id===id)}
function stTag(s){return `<span class="tag ${ST_CLS[s]||'tag-gray'}">${s}</span>`}
function todoOf(b){return b.status==='审核中'&&b.cur==='二级审批'&&!b.mine}
function canWithdrawBill(b){
  if(!b) return false;
  const isPending = (b.status === '审核中' || b.status === '待审批');
  if(!isPending) return false;
  const hasReviewed = Array.isArray(b.chain) && b.chain.slice(1).some(c => c.s === 'done');
  return !hasReviewed;
}

function chainHtml(b){
  return `<div class="chain">${b.chain.map(c=>{
    if(c.s==='skip')return `<div class="ch-step"><div class="ch-dot">—</div><div class="ch-name" style="color:var(--text-3)">${c.n}</div><div class="ch-sub">${c.op||'无需此环节'}</div></div>`;
    const cls=c.s==='done'?'done':c.s==='cur'?'cur':'';
    const icon=c.s==='done'?'✓':c.s==='cur'?'●':'○';
    return `<div class="ch-step ${cls}"><div class="ch-dot">${icon}</div><div class="ch-name">${c.n}</div><div class="ch-sub">${c.u||''}${c.t?'<br>'+c.t:''}</div>${c.op?`<div class="ch-sub" style="margin-top:2px">${c.op}</div>`:''}</div>`;
  }).join('')}</div>`;
}

    if (filterSt === '全部') return true;
    if (filterSt === '待审批') return b.status === '审核中' || b.status === '待审批';
    if (filterSt === '已驳回') return b.status === '审批驳回' || b.status === '已驳回';
    if (filterSt === '已完结') return b.status === '已通过' || b.status === '已排课' || b.status === '已作废' || b.status === '已撤销' || b.status === '已完结';
    return true;
  };

  const cntMine = st => st === '全部' ? mineAll.length : mineAll.filter(b => matchMineStatus(b, st)).length;
  const filteredMine = mineAll.filter(b => matchMineStatus(b, mineStatus));

  const tabs=`<div class="sub-tabs">
   <div class="sub-tab ${mainTab==='todo'?'active':''}" onclick="switchTab('todo')">我的待审批${todos.length?`<span class="cnt">${todos.length}</span>`:''}</div>
   <div class="sub-tab ${mainTab==='mine'?'active':''}" onclick="switchTab('mine')">我提交的${mineAll.length?`<span class="cnt" style="background:var(--primary-2)">${mineAll.length}</span>`:''}</div>
   <span style="flex:1"></span>
   <div class="sub-tab ${mineStatus==='全部'?'active':''}" style="font-size:12px;padding:6px 12px" onclick="mineStatus='全部';render()">全部(${cntMine('全部')})</div>
   <div class="sub-tab ${mineStatus==='待审批'?'active':''}" style="font-size:12px;padding:6px 12px" onclick="mineStatus='待审批';render()">待审批(${cntMine('待审批')})</div>
   <div class="sub-tab ${mineStatus==='已驳回'?'active':''}" style="font-size:12px;padding:6px 12px" onclick="mineStatus='已驳回';render()">已驳回(${cntMine('已驳回')})</div>
   <div class="sub-tab ${mineStatus==='已完结'?'active':''}" style="font-size:12px;padding:6px 12px" onclick="mineStatus='已完结';render()">已完结(${cntMine('已完结')})</div>
  </div>`;

  const cards=filteredMine.map(b=>`<div class="card" style="margin-bottom:12px"><div class="card-body">
   <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
     <b class="c-name" style="cursor:pointer;color:var(--primary);font-size:15px" onclick="openDocModal('${b.id}')">${b.id}</b>
     <span class="tag ${TYPE_CLS[b.type]}">${b.type}</span>${stTag(b.status)}
     <span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span>
     <span style="font-size:12px;color:var(--text-3);margin-left:auto">提交于 ${b.time}</span>
   </div>
   <div style="font-size:14px;font-weight:600;margin-bottom:10px">${b.title}</div>
   ${chainHtml(b)}
   <div style="display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap;align-items:center">
     <button class="btn btn-ghost" style="height:26px;font-size:12px" onclick="openDocModal('${b.id}')">查看公文呈批单</button>
     ${(b.status==='审核中'||b.status==='待审批')?`
       <button class="btn-text" onclick="toast('已向当前节点审批人推送催办短信与系统提醒')">🔔 催办</button>
       ${canWithdrawBill(b)?`<button class="btn-text danger" onclick="doWithdraw('${b.id}')">↩ 撤销申请</button>`:`<span style="font-size:12px;color:var(--text-3);margin-left:4px">（已有节点审核，不可撤销）</span>`}
     `:''}
     ${(b.status==='审批驳回'||b.status==='已驳回')?`
       <button class="btn-text" onclick="openDocModal('${b.id}')">修改重提</button>
       <button class="btn-text danger" onclick="doVoid('${b.id}')">作废单据</button>`:''}
     ${(b.status==='已撤销')?`<span class="mini-note" style="margin:0;color:var(--text-3)">↩ 申请人已主动撤销审批 · 预锁定资源已全部解除释放</span>`:''}
     ${(b.status==='已排课'||b.status==='已通过'||b.status==='已完结')?`<span class="mini-note" style="margin:0;color:var(--success)">✓ 单据已办结并留存全周期档案库</span>`:''}
   </div>
  </div></div>`).join('');

  return tabs+(cards||`<div class="card"><div class="card-body" style="text-align:center;color:var(--text-3);padding:40px">暂无【${mineStatus}】状态的我提交审批单据</div></div>`);
}

/* ============ 3. 审批记录（全周期审批档案） ============ */
function vRecord(){
  const kw=recKeyword.toLowerCase();
  const list=BILLS.filter(b=>{
    if(recFilter.type&&b.type!==recFilter.type)return false;
    if(recFilter.status&&b.status!==recFilter.status)return false;
    if(kw&&!b.id.toLowerCase().includes(kw)&&!b.title.toLowerCase().includes(kw)&&!b.applicant.toLowerCase().includes(kw))return false;
    return true;
  });

  const totalCnt=BILLS.length;
  const passCnt=BILLS.filter(b=>b.status==='已通过'||b.status==='已排课').length;
  const auditCnt=BILLS.filter(b=>b.status==='审核中').length;
  const rejectCnt=BILLS.filter(b=>b.status==='审批驳回'||b.status==='已驳回'||b.status==='已作废').length;

  const stats=`<div class="stat-cards" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    <div class="stat ${!recFilter.status?'active':''}" onclick="recFilter.status='';render()"><div class="n">${totalCnt}</div><div class="l">全周期档案总数</div></div>
    <div class="stat ${recFilter.status==='已通过'?'active':''}" onclick="recFilter.status='已通过';render()"><div class="n g">${passCnt}</div><div class="l">已办结/已通过</div></div>
    <div class="stat ${recFilter.status==='审核中'?'active':''}" onclick="recFilter.status='审核中';render()"><div class="n o">${auditCnt}</div><div class="l">审核流转中</div></div>
    <div class="stat ${recFilter.status==='审批驳回'?'active':''}" onclick="recFilter.status='审批驳回';render()"><div class="n r">${rejectCnt}</div><div class="l">驳回/作废留存</div></div>
  </div>`;

  const rows=`<div class="card"><div class="card-body">
   <div class="filter-bar">
     <input class="input" placeholder="输入单据号/标题/申请人回车检索…" value="${recKeyword}" oninput="recKeyword=this.value.trim();render()">
     <select class="sel" onchange="recFilter.type=this.value;render()">
       <option value="">全部审批类型</option>
       ${ALL_TYPES.map(t=>`<option ${recFilter.type===t?'selected':''}>${t}</option>`).join('')}
     </select>
     <select class="sel" onchange="recFilter.status=this.value;render()">
       <option value="">全部审批状态</option>
       ${['审核中','已排课','已通过','审批驳回','已驳回','已作废'].map(s=>`<option ${recFilter.status===s?'selected':''}>${s}</option>`).join('')}
     </select>
     <button class="btn btn-ghost" onclick="recFilter.type='';recFilter.status='';recKeyword='';render()">重置</button>
     <span style="font-size:12px;color:var(--text-3);margin-left:auto">共收录审批全生命周期档案 ${list.length} 件（支持溯源核验）</span>
     <button class="btn btn-primary" style="margin-left:8px" onclick="toast('已导出全周期审批单据台账Excel包（含审批链路留痕）')">📥 导出台账</button>
   </div>
   <div class="table-wrap">
    <table class="data-table" style="min-width:1180px"><thead><tr>
     <th style="width:130px">单据编号</th><th style="width:100px">类型</th><th style="min-width:240px">审批标题</th><th style="width:130px">申请人</th><th style="width:140px">提交时间</th><th>审批路径</th><th style="width:90px">资源锁定</th><th style="width:80px">最终状态</th><th style="width:130px">操作</th>
   </tr></thead><tbody>
   ${list.map(b=>`<tr>
     <td class="c-name" onclick="openDocModal('${b.id}')">${b.id}</td>
     <td><span class="tag ${TYPE_CLS[b.type]}">${b.type}</span></td>
     <td style="max-width:280px"><div class="cell-ellipsis" style="max-width:280px" title="${b.title}" data-tooltip="${b.title}" onclick="openDocModal('${b.id}')"><b>${b.title}</b></div></td>
     <td>${b.applicant}<br><span style="font-size:11px;color:var(--text-3)">${b.dept}</span></td>
     <td>${b.time}</td>
     <td style="font-size:12px;color:var(--text-2)">
       ${b.chain.filter(c=>c.s==='done').map(c=>c.n).join(' → ')}${b.cur!=='—'?' → <b style="color:var(--warning)">'+b.cur+'</b>':''}
     </td>
     <td><span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span></td>
     <td>${stTag(b.status)}</td>
     <td>
       <button class="btn btn-ghost" style="height:26px;padding:0 8px;font-size:12px" onclick="openDocModal('${b.id}')">呈批单</button>
       <button class="btn-text" onclick="openDrawer('${b.id}')">详情</button>
     </td>
   </tr>`).join('')||'<tr><td colspan="9" style="text-align:center;color:var(--text-3);padding:36px">暂无符合筛选条件的审批单据</td></tr>'}
   </tbody></table>
  </div></div>`;

  return stats+rows;
}

/* ================= 专属公文审签大单据页面/模态渲染 ================= */
function openDocModal(id){
  const b=findB(id);if(!b)return;
  $('docCode').textContent=b.id;
  $('docBadgeType').textContent=b.type;
  $('docBadgeType').className='badge-type '+(b.type==='方案审批'?'tag-blue':b.type==='排课审批'?'tag-blue':b.type==='预算审批'?'tag-purple':b.type==='开结班审批'?'tag-green':b.type==='调停课审批'?'tag-orange':'tag-cyan');
  
  // 渲染红头公文单
  let specificHtml='';
  if(b.type==='方案审批') specificHtml=renderSchemeDoc(b);
  else if(b.type==='计划审批') specificHtml=renderPlanDoc(b);
  else if(b.type==='排课审批') specificHtml=renderScheduleDoc(b);
  else if(b.type==='预算审批') specificHtml=renderBudgetDoc(b);
  else if(b.type==='开结班审批') specificHtml=renderClassDoc(b);
  else if(b.type==='调停课审批') specificHtml=renderAdjustDoc(b);
  else if(b.type==='学员请假审批'||b.type==='请假审批') specificHtml=renderLeaveDoc(b);

  const canApprove=todoOf(b);
  const sealText=b.status==='审核中'?'待批件':b.status==='已排课'||b.status==='已通过'?'准予执行':b.status==='审批驳回'||b.status==='已驳回'?'予以驳回':b.status==='已撤销'?'已撤销':'已作废';

  $('docBody').innerHTML=`
    <div class="paper-sheet">
      <div class="stamp-seal">
        <span class="s-sub">干部**学院</span>
        <span class="s-main">${sealText}</span>
        <span class="s-star">★ 档案留存 ★</span>
      </div>
      <div class="red-header">
        <div class="inst-name">干部**学院教务呈批签报单</div>
        <div class="doc-kind">${b.type} · 审签办结专页</div>
        <div class="doc-meta-row">
          <span>呈报单号：<b>${b.id}</b></span>
          <span>主报部门：${b.dept}</span>
          <span>提报人员：${b.applicant}</span>
          <span>提交时间：${b.time}</span>
          <span>密级：内部事项</span>
        </div>
      </div>

      <!-- 审批事项公文表头 -->
      <table class="doc-table">
        <tr>
          <td class="field-label">审批事项标题</td>
          <td class="field-val" colspan="3"><b>${b.title}</b></td>
        </tr>
        <tr>
          <td class="field-label">审批类型</td>
          <td class="field-val"><span class="tag ${TYPE_CLS[b.type]}">${b.type}</span></td>
          <td class="field-label">当前状态</td>
          <td class="field-val">${stTag(b.status)} · <span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span></td>
        </tr>
      </table>

      <!-- 核心专属业务审签块 -->
      ${specificHtml}

      <!-- 审批流转轨迹与签名 -->
      <div class="spec-box" style="margin-top:20px;border-color:#cbd5e1">
        <div class="spec-title">📋 审批流转及分级签署记录</div>
        ${chainHtml(b)}
        <div style="margin-top:14px;background:#f8fafc;padding:12px;border-radius:6px;font-size:12.5px;color:var(--text-2);line-height:1.8">
          ${b.chain.map(c=>`<div><b>[${c.n}]</b> ${c.u} · ${c.s==='done'?'<span style="color:var(--success)">已通过</span>':'<span style="color:var(--warning)">待审核</span>'} ${c.t?`(${c.t})`:''}：${c.op||'—'}</div>`).join('')}
        </div>
      </div>

      <!-- 领导批示填报区 -->
      ${canApprove?`
      <div class="spec-box" style="background:#fffaf0;border-color:#fcd34d;margin-top:16px">
        <div class="spec-title" style="color:#b45309">✍️ 二级审批员审签批示意见 <span style="font-size:12px;color:var(--danger)">（通过需批复明确意见，驳回必填原因）</span></div>
        <div class="quick-ops">
          <span style="font-size:12px;color:var(--text-3);line-height:24px">快捷意见：</span>
          <span class="quick-chip" onclick="setDocOp('审签同意。本期培训班教学方案编制规范、课程与师资配置合理，准予按此方案组织实施排课，已抄送教务部领导知悉备案。')">同意·方案生效实施</span>
          <span class="quick-chip" onclick="setDocOp('审签同意。教学方案完备，请带班团队统筹做好初步场地与后勤保障衔接。')">同意·抓好落实</span>
          <span class="quick-chip" onclick="setDocOp('退回修改：请结合学员结构优化专题讲授与研讨课时配比，完善方案后重报。')">退回·调整课时</span>
          <span class="quick-chip" onclick="setDocOp('审签同意。本年度重点班次编制科学，请教务部按计划统筹师资与教学场地，抓好组织实施。')">同意·发布教学计划</span>
          <span class="quick-chip" onclick="setDocOp('同意。符合教培管理办法，按规范组织实施。')">同意·按规范实施</span>
          <span class="quick-chip" onclick="setDocOp('同意。预算科目核验合规，锁定为报销控制基线。')">同意·锁定预算基线</span>
          <span class="quick-chip" onclick="setDocOp('同意排课。资源转正式锁定，同步三课表。')">同意·锁定课表</span>
          <span class="quick-chip" onclick="setDocOp('同意请假。请带班组织员督促落实自修与补课。')">同意请假·督促补课</span>
          <span class="quick-chip" onclick="setDocOp('驳回：相关佐证材料不全，请补充专家公函后重新发起。')">驳回·补交材料</span>
        </div>
        <textarea class="input" id="docOpText" rows="3" placeholder="请在此输入审批意见（例如：同意。经核验符合管理规范，准予实施…）" style="width:100%;margin-top:6px"></textarea>
      </div>`:''}
    </div>
  `;

  // 底部动作栏
  let footHtml=`<button class="btn btn-ghost" onclick="closeDocModal()">关闭窗口</button>`;
  if(canApprove){
    footHtml=`
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)">
        <span>当前节点：<b>二级审批员（处领导终审/流转）</b></span>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-danger" onclick="doApproveDoc('${b.id}',false)">⛔ 审批驳回并释放资源</button>
        <button class="btn btn-success" onclick="doApproveDoc('${b.id}',true)">✅ 审签核准通过</button>
      </div>
    `;
  } else if(b.mine && canWithdrawBill(b)){
    footHtml=`
      <div style="font-size:12.5px;color:#d97706;display:flex;align-items:center;gap:6px">
        <span>⏳ <b>审批中（未审核）：</b>当前尚未有领导签批，您作为提请人可在审核前撤销申请并释放预锁定资源</span>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-danger" style="background:#fff;border-color:var(--danger);color:var(--danger)" onclick="doWithdraw('${b.id}');closeDocModal()">↩ 撤销申请</button>
        <button class="btn btn-primary" onclick="closeDocModal()">关闭窗口</button>
      </div>
    `;
  } else if(b.status === '已撤销'){
    footHtml=`
      <div style="font-size:12px;color:var(--text-3)">⚠️ 本审批单已由提报人主动撤销，审批流转终止，关联预锁定资源已全部解除释放</div>
      <button class="btn btn-primary" onclick="closeDocModal()">已阅确认</button>
    `;
  } else {
    footHtml=`
      <div style="font-size:12px;color:var(--text-3)">单据办结状态，归档于干部**学院教务审批数字档案库</div>
      <button class="btn btn-primary" onclick="closeDocModal()">已阅确认</button>
    `;
  }
  $('docFoot').innerHTML=footHtml;

  $('docMask').classList.remove('hidden');
  $('docModal').classList.remove('hidden');
}

function setDocOp(txt){
  const el=$('docOpText');if(el)el.value=txt;
}

function closeDocModal(){
  $('docMask').classList.add('hidden');
  $('docModal').classList.add('hidden');
}

/* ============ 各类型专属单据内容模板 ============ */
// 0-1. 方案审批专属公文单（培训班教学方案请示呈批：处领导审核 · 抄教务部领导）
function renderSchemeDoc(b){
  const s = b.scheme || {};
  return `
    <div class="spec-box" style="background:#f0f9ff;border-color:#bae6fd">
      <div class="spec-title" style="color:#0369a1">🏛️ 呈请班次基础信息与办训规格</div>
      <table class="doc-table" style="margin-bottom:0">
        <tr>
          <td class="field-label">呈请班次名称</td><td class="field-val"><b>${s.clsName||b.title}</b>（${s.clsId||'—'}）</td>
          <td class="field-label">培训类别/对象</td><td class="field-val"><span class="tag tag-blue">${s.cat||'主体培训'}</span> · ${s.target||'学员'}</td>
        </tr>
        <tr>
          <td class="field-label">主办/承办单位</td><td class="field-val">${s.host||'办公厅'} / ${s.dept||'教务管理办'}</td>
          <td class="field-label">培训周期/天数</td><td class="field-val">${s.duration||s.dates||'—'}</td>
        </tr>
        <tr>
          <td class="field-label">带班责任教师</td><td class="field-val"><b style="color:var(--primary)">👨‍🏫 ${s.headTeacher||'张三'}</b></td>
          <td class="field-label">初步分配场地</td><td class="field-val"><b style="color:var(--primary)">📍 ${s.room||'教学大楼 301报告厅'}</b></td>
        </tr>
        <tr>
          <td class="field-label">培训学员规模</td><td class="field-val"><b style="color:var(--success)">${s.stuCount||45} 人</b></td>
          <td class="field-label">批复预算额度</td><td class="field-val"><b style="color:var(--danger)">${s.budget||'¥185,000'}</b></td>
        </tr>
      </table>
    </div>

    <div class="spec-box">
      <div class="spec-title">📚 核心课程配置、课时分布与培养方案说明</div>
      <div style="background:#f8fafc;padding:12px;border-radius:6px;border:1px solid #e2e8f0;font-size:13px;line-height:1.8;margin-bottom:12px">
        <b>核心课程体系构成：</b><br>
        <span style="color:var(--text);font-weight:600">${s.courses||'习近平外交思想概论(16课时) / 宏观经济形势分析(6课时) / 涉外法治与海外利益安全(8课时)'}</span><br>
        <b>总核定课时：</b><span style="color:var(--primary);font-weight:800;font-size:15px">${s.totalHours||30}</span> 课时 ｜ <b>组织形式：</b>脱产集训、随堂考勤、专家讲授、结构化研讨与综合汇报
      </div>
      <div style="background:#fff;padding:12px;border-radius:6px;border:1px solid #cbd5e1;font-size:12.5px;color:var(--text-2);line-height:1.7">
        <b>教学方案请示说明与培养目标：</b><br>
        ${s.purpose||'紧扣干部政治能力与履职实战能力需求，采取集中面授、名家导读、实景模拟与结构化研讨相结合。开班前提前锁定初步场地与核心师资，结班前组织教学成果综合汇报与考核鉴定。'}

/* ============ 审批执行动作 ============ */
function doApproveDoc(id,pass){
  const b=findB(id);
  const op=($('docOpText')?$('docOpText').value.trim():'');
  if(!op){
    toast('请在批示框内输入审批意见（通过需批示，驳回必填原因）');
    if($('docOpText'))$('docOpText').focus();
    return;
  }
  executeApproval(b,pass,op);
  closeDocModal();
}

function doApproveDrawer(id,pass){
  const b=findB(id);
  const op=($('dwOpText')?$('dwOpText').value.trim():'');
  if(!op){
    toast('请填写审批意见');
    if($('dwOpText'))$('dwOpText').focus();
    return;
  }
  executeApproval(b,pass,op);
  closeDrawer();
}

function executeApproval(b,pass,op){
  const node=b.chain ? b.chain.find(c=>c.s==='cur') : null;
  const timeStr=new Date().toLocaleString();
  if(node){
    node.s='done';
    node.t=timeStr;
    node.op=(pass?'同意。':'驳回：')+op;
  }
  b.cur='—';

  // 全局 Store 联动
  if(window.TREA_STORE){
    window.TREA_STORE.reviewApproval(b.id, pass, op);
  }

  if(pass){
    if(b.type==='方案审批'){
      b.status='已通过';b.lock='正式生效';b.ccStatus='已抄送 (送达3级教务处领导)';
      const approverName = b.mainLeader ? b.mainLeader.split(' ')[0] : '李处长';
      if(b.chain){
        const auditNode = b.chain.find(c => c.n === '处领导审核');
        if(auditNode){ auditNode.s = 'done'; auditNode.t = timeStr; auditNode.op = '审签同意：' + op; }
        const ccNode = b.chain.find(c => c.n.includes('抄送'));
        if(ccNode){ ccNode.s = 'done'; ccNode.t = timeStr; ccNode.op = '【已触发抄送】二级处领导核准通过，方案送审稿已自动抄送分发至 3级教务处领导 (王教务长/综合办) 端知悉备案'; }
      }
      try {
        let schemes = [];
        const rawSchemes = localStorage.getItem('TREA_SCHEME_APPROVALS');
        if(rawSchemes){
          try {
            const parsed = JSON.parse(rawSchemes);
            schemes = Array.isArray(parsed) ? parsed : Object.values(parsed);
          } catch(e){}
        }
        const cid = (b.scheme && b.scheme.clsId) || (b.scheme && b.scheme.classId) || b.classId || 'B2503';
        let found = schemes.find(x => x.classId === cid || x.id === b.id);
        if(!found){
          found = { id: b.id, classId: cid, className: b.title };
          schemes.unshift(found);
        }
        found.status = '已通过';
        found.lock = '正式生效';
        found.opinion = op;
        found.approver = approverName;
        found.approveTime = timeStr;
        found.ccStatus = '已抄送 3级教务处领导 (王教务长/综合办)';
        localStorage.setItem('TREA_SCHEME_APPROVALS', JSON.stringify(schemes));
      } catch(e){}
      toast(`👑 【${b.id}】方案审批核准通过！二级审核已通过，系统已自动抄送 3级教务处领导知悉备案，方案正式生效！`, 'success');
    } else if(b.type==='计划审批'){
      b.status='已通过';b.lock='正式下达';
      try {
        const syncData = { status: '已发布', approver: '陈建国 (常务副院长)', opinion: op, time: timeStr };
        localStorage.setItem('TREA_PLAN_STATUS_2026', JSON.stringify(syncData));
        const rawPlans = localStorage.getItem('TREA_ANNUAL_PLANS');
        if(rawPlans){
          const plans = JSON.parse(rawPlans);
          const p26 = plans.find(p=>p.y==='2026');
          if(p26){
            p26.status = '已发布';
            p26.approver = '陈建国 (常务副院长)';
            p26.leaderOpinion = op;
            p26.approveTime = timeStr;
            p26.classes.forEach(c=>c.status='已发布');
            p26.logs.push({ time: timeStr, user: '陈建国 (常务副院长)', action: '院领导审签通过 (审批管理)', note: '签批意见：' + op });
            localStorage.setItem('TREA_ANNUAL_PLANS', JSON.stringify(plans));
          }
        }
      } catch(e){}
      toast(`👑 【${b.id}】计划审批核准通过！《2026年学院重点班次教学计划》已正式发布下达并生成学年排课任务！`, 'success');
    } else if(b.type==='排课审批'){
      b.status='已排课';b.lock='正式锁定';
      toast(`✅ 【${b.id}】排课审批通过！资源已转正式锁定，班级/教师/教室三课表同步生成，短信已推送`, 'success');
    } else if(b.type==='预算审批'){
      b.status='已通过';b.lock='已锁定基线';
      toast(`✅ 【${b.id}】预算审批通过！预算金额已正式固化为项目报销控制硬基线`, 'success');
    } else if(b.type==='开结班审批'){
      b.status='已通过';
      toast(`✅ 【${b.id}】开结班核准通过！班次状态已自动同步更新`, 'success');
    } else if(b.type==='调停课审批'){
      b.status='已通过';b.lock='已释放';
      toast(`✅ 【${b.id}】调停课审批通过！原资源已释放，新课表已更新并通知学员`, 'success');
    } else {
      b.status='已通过';
      toast(`✅ 【${b.id}】请假审批核准通过！考勤系统已登记请假，学时已完成核减`, 'success');
    }
  } else {
    if(b.type==='方案审批'){
      b.status='审批驳回';b.lock='已释放';b.ccStatus='未抄送 (审核驳回)';
      const approverName = b.mainLeader ? b.mainLeader.split(' ')[0] : '李处长';
      if(b.chain){
        const auditNode = b.chain.find(c => c.n === '处领导审核');
        if(auditNode){ auditNode.s = 'done'; auditNode.t = timeStr; auditNode.op = '退回修改：' + op; }
        const ccNode = b.chain.find(c => c.n.includes('抄送'));
        if(ccNode){ ccNode.s = 'wait'; ccNode.t = '—'; ccNode.op = '【未触发抄送】审核未通过，不予以抄送 3级教务处领导'; }
      }
      try {
        let schemes = [];
        const rawSchemes = localStorage.getItem('TREA_SCHEME_APPROVALS');
        if(rawSchemes){
          try {
            const parsed = JSON.parse(rawSchemes);
            schemes = Array.isArray(parsed) ? parsed : Object.values(parsed);
          } catch(e){}
        }
        const cid = (b.scheme && b.scheme.clsId) || (b.scheme && b.scheme.classId) || b.classId || 'B2503';
        let found = schemes.find(x => x.classId === cid || x.id === b.id);
        if(!found){
          found = { id: b.id, classId: cid, className: b.title };
          schemes.unshift(found);
        }
        found.status = '审批驳回';
        found.lock = '已释放';
        found.opinion = op;
        found.approver = approverName;
        found.approveTime = timeStr;
        found.ccStatus = '未抄送 (审核驳回)';
        localStorage.setItem('TREA_SCHEME_APPROVALS', JSON.stringify(schemes));
      } catch(e){}
      toast(`⛔ 【${b.id}】教学方案已审批驳回！批示意见已退回带班教务员修改重报（抄送已阻断）。`, 'warning');
    } else if(b.type==='计划审批'){
      b.status='已驳回';b.lock='已释放';
      try {
        const syncData = { status: '已驳回', approver: '陈建国 (常务副院长)', opinion: op, time: timeStr };
        localStorage.setItem('TREA_PLAN_STATUS_2026', JSON.stringify(syncData));
        const rawPlans = localStorage.getItem('TREA_ANNUAL_PLANS');
        if(rawPlans){
          const plans = JSON.parse(rawPlans);
          const p26 = plans.find(p=>p.y==='2026');
          if(p26){
            p26.status = '已驳回';
            p26.approver = '陈建国 (常务副院长)';
            p26.leaderOpinion = op;
            p26.approveTime = timeStr;
            p26.classes.forEach(c=>c.status='已驳回(待修改)');
            p26.logs.push({ time: timeStr, user: '陈建国 (常务副院长)', action: '院领导审签驳回 (审批管理)', note: '退回修改：' + op });
            localStorage.setItem('TREA_ANNUAL_PLANS', JSON.stringify(plans));
          }
        }
      } catch(e){}
      toast(`⛔ 【${b.id}】教学计划已审批驳回！批示意见已退回教务部重新修订。`, 'warning');
    } else {
      b.status=b.type==='排课审批'?'审批驳回':'已驳回';
      if(b.lock==='预锁定')b.lock='已释放';
      toast(`⛔ 【${b.id}】已审批驳回！预锁定资源已全额释放，已退回申请人`, 'warning');
    }
  }

  render();
}

/* ============ 轻量抽屉详情（辅助快捷审批） ============ */
function openDrawer(id){
  const b=findB(id);if(!b)return;
  $('dwTitle').innerHTML=b.id+' · '+b.type;
  const canApprove=todoOf(b);

  $('dwBody').innerHTML=`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      ${stTag(b.status)}<span class="tag ${LOCK[b.lock]||'tag-gray'}">${b.lock}</span>
      <span style="font-size:12px;color:var(--text-3)">当前节点：${b.cur}</span>
    </div>
    <div class="d-sec" style="margin-top:0">申请基础信息</div>
    <div class="d-grid">
      <span class="k">单据编号</span><span><b>${b.id}</b></span>
      <span class="k">标题</span><span>${b.title}</span>
      <span class="k">申请人</span><span>${b.applicant}（${b.dept}）</span>
      <span class="k">提交时间</span><span>${b.time}</span>
    </div>
    <div class="d-sec">审批流转轨迹</div>
    ${chainHtml(b)}
    ${canApprove?`
      <div class="d-sec">快捷批示意见</div>
      <textarea class="input" id="dwOpText" rows="3" placeholder="请输入审批意见…">同意。经核验符合管理规范。</textarea>
    `:''}
  `;

  let foot=`<button class="btn btn-ghost" onclick="closeDrawer()">关闭</button>`;
  if(canApprove){
    foot+=`
      <button class="btn btn-primary" onclick="openDocModal('${b.id}');closeDrawer()">调取公文大单据</button>
      <button class="btn btn-danger" onclick="doApproveDrawer('${b.id}',false)">驳回</button>
      <button class="btn btn-success" onclick="doApproveDrawer('${b.id}',true)">通过</button>
    `;
  }
  $('dwFoot').innerHTML=foot;

  $('drawerMask').classList.remove('hidden');
  $('drawer').classList.remove('hidden');
}

function closeDrawer(){
  $('drawerMask').classList.add('hidden');
  $('drawer').classList.add('hidden');
}

function doWithdraw(id){
  const b=findB(id);
  if(!b) return;
  if(!canWithdrawBill(b)){
    toast('该审批单已有审核节点完成签批，无法撤销！若需调整请联系审批人驳回或沟通', 'warning');
    return;
  }
  if(!confirm('确认撤销「'+b.id+'」？\n\n撤销后审批流转将立即终止，关联预锁定的场地、教室及师资等资源将解除锁定并释放。')) return;
  const timeStr = new Date().toLocaleString('zh-CN', {hour12: false});
  b.status='已撤销';
  b.lock='已释放';
  b.cur='—';
  b.chain.push({
    n:'撤销申请',
    u:ME,
    s:'done',
    t:timeStr,
    op:'申请人主动撤销申请，审批流转已终止，解除全部预锁定资源'
  });

  // 同步更新方案审批数据
  try {
    const rawSchemes = localStorage.getItem('TREA_SCHEME_APPROVALS');
    if(rawSchemes){
      let schemes = JSON.parse(rawSchemes);
      if (!Array.isArray(schemes)) schemes = Object.values(schemes);
      const cid = (b.scheme && (b.scheme.clsId || b.scheme.classId)) || b.classId || '';
      const target = schemes.find(x => x.id === b.id || (cid && x.classId === cid));
      if(target){
        target.status = '已撤销';
        target.lock = '已释放';
        target.currentNode = '已撤销';
        target.approver = '—';
        target.chain = target.chain || [];
        target.chain.push({
          n: '撤销请示',
          u: ME,
          s: 'done',
          t: timeStr,
          op: '申请人主动撤销方案请示公文，流转终止'
        });
        localStorage.setItem('TREA_SCHEME_APPROVALS', JSON.stringify(schemes));
      }
    }
  } catch(e){}

  // 同步更新计划审批数据
  if(b.type === '计划审批'){
    try {
      const syncData = { status: '已撤销', approver: '—', opinion: '申请人撤销提请', time: timeStr };
      localStorage.setItem('TREA_PLAN_STATUS_2026', JSON.stringify(syncData));
    } catch(e){}
  }

  toast('已成功撤销申请：单据流转已终止，关联预锁定资源已解锁释放', 'success');
  render();
}

function doVoid(id){
  const b=findB(id);
  if(!confirm('确认作废「'+b.id+'」？'))return;
  b.status='已作废';b.lock='已释放';b.cur='—';
  b.chain.push({n:'作废',u:ME,s:'done',t:new Date().toLocaleString(),op:'单据作废，释放全部资源'});
  toast('单据已作废');
  render();
}

/* ============ URL 参数自适应路由初始化 ============ */
const urlParams=new URLSearchParams(location.search);
const pageParam=urlParams.get('page')||urlParams.get('tab')||urlParams.get('type');

let initialView='apv-my';
if(pageParam){
  if(pageParam.includes('my')||pageParam==='我的审批'||pageParam.includes('todo')||pageParam.includes('mine')) initialView='apv-my';
  else if(pageParam.includes('record')||pageParam==='审批记录'||pageParam==='all') initialView='apv-record';
  else if(pageParam.includes('scheme')||pageParam==='方案审批') initialView='apv-scheme';
  else if(pageParam.includes('plan')||pageParam==='计划审批') initialView='apv-plan';
  else if(pageParam.includes('sched')) initialView='apv-schedule';
  else if(pageParam.includes('budget')||pageParam==='预算审批') initialView='apv-budget';
  else if(pageParam.includes('class')||pageParam==='开结班审批') initialView='apv-class';
  else if(pageParam.includes('adjust')||pageParam==='调停课审批') initialView='apv-adjust';
  else if(pageParam.includes('leave')||pageParam==='学员请假审批') initialView='apv-leave';
}

// 同步 localStorage 中的方案审批数据
try {
  const rawSchemes = localStorage.getItem('TREA_SCHEME_APPROVALS');
  if(rawSchemes){
    const schemes = JSON.parse(rawSchemes);
    Object.keys(schemes).forEach(cid => {
      const item = schemes[cid];
      const existing = BILLS.find(b => b.id === item.id);
      if(existing){
        existing.status = item.status || existing.status;
        existing.lock = item.lock || existing.lock;
        existing.title = item.title || existing.title;
        existing.cur = item.cur || existing.cur;
        if(item.chain) existing.chain = item.chain;
        if(item.scheme) existing.scheme = item.scheme;
      } else {
        BILLS.unshift({
          id: item.id,
          type: '方案审批',
          title: item.title,
          applicant: (item.applicant || '张三').split(' ')[0],
          dept: item.deptName || '培训处',
          time: item.submitTime || new Date().toLocaleString(),
          status: item.status || '审核中',
          lock: item.lock || '预锁定',
          cur: item.status === '已通过' ? '—' : '二级审批',
          mine: false,
          scheme: item,
          chain: item.chain || [
            { n: '教务提请', u: item.applicant || '张三', s: 'done', t: item.submitTime, op: '编制教学方案并提请处领导审签，抄送教务部领导' },
            { n: '处领导审核', u: '张三 (培训处处领导)', s: item.status === '审核中' ? 'cur' : 'done', t: item.approveTime || '', op: item.opinion || '' },
            { n: '抄送教务部', u: '教务部领导', s: 'done', t: item.submitTime, op: '【抄送知悉】教学方案已分送教务部领导端同步阅览备案' }
          ]
        });
      }
    });
  }
} catch(e){}

try {
  const syncPlan = localStorage.getItem('TREA_PLAN_STATUS_2026');
  if(syncPlan){
    const sp = JSON.parse(syncPlan);
    const bPlan = BILLS.find(b=>b.id==='JH-2026-0001');
    if(bPlan && sp.status){
      if(sp.status==='已发布'){
        bPlan.status = '已通过';
        bPlan.lock = '正式下达';
        bPlan.cur = '—';
        const node = bPlan.chain.find(c=>c.s==='cur');
        if(node){ node.s='done'; node.t=sp.time||''; node.op='审签同意：'+(sp.opinion||''); }
      } else if(sp.status==='已驳回'){
        bPlan.status = '已驳回';
        bPlan.lock = '已释放';
        bPlan.cur = '—';
        const node = bPlan.chain.find(c=>c.s==='cur');
        if(node){ node.s='done'; node.t=sp.time||''; node.op='驳回：'+(sp.opinion||''); }
      } else if(sp.status==='待院领导审批'){
        bPlan.status = '审核中';
        bPlan.lock = '预锁定';
        bPlan.cur = '二级审批';
      }
    }
  }
} catch(e){}

showView(initialView);
const activeNavEl = document.querySelector('.nav-child[data-id="'+initialView+'"]') || document.querySelector('.nav-child[data-id="apv-my"]');
if (typeof setNavActive === 'function' && activeNavEl) setNavActive(activeNavEl);

const idParam=urlParams.get('id');
if(idParam){
  const found=findB(idParam);
  if(found){
    openDocModal(idParam);
  }
}

window.showLib = function(id) {
  if (VIEW_MAP[id] || id === 'apv-record' || id === 'apv-my') {
    showView(id);
  }
};
window.LIB_NAME = Object.assign({}, VIEW_MAP, {'apv-my':'我的审批', 'apv-record':'审批记录'});
</script>
