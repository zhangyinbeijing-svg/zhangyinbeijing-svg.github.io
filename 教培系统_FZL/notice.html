<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息通知与协同待办中心 · 干部**学院教培管理系统</title>
<link rel="stylesheet" href="common.css">
<script src="store.js"></script>

<style>
/* ============ 通知中心专属样式 ============ */
.stat-banner {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.stat-card {
  background: #fff;
  border-radius: var(--r-card);
  padding: 16px 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.2s;
}
.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
.stat-card.active-stat {
  border-color: var(--primary);
  background: #fafcff;
}
.sc-info .sc-title { font-size: 13px; color: var(--text-3); font-weight: 500; }
.sc-info .sc-num { font-size: 26px; font-weight: 700; font-family: Consolas, monospace; margin-top: 4px; color: var(--text); }
.sc-info .sc-num.danger { color: var(--danger); }
.sc-info .sc-num.warning { color: var(--warning); }
.sc-info .sc-num.primary { color: var(--primary); }
.sc-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  background: #f0f4f9;
}
.sc-icon.red { background: rgba(198, 40, 40, 0.1); color: var(--danger); }
.sc-icon.orange { background: rgba(245, 127, 23, 0.1); color: var(--warning); }
.sc-icon.blue { background: rgba(46, 117, 182, 0.1); color: var(--primary-2); }
.sc-icon.green { background: rgba(46, 125, 50, 0.1); color: var(--success); }

/* 主工作区布局 */
.notice-box {
  background: #fff;
  border-radius: var(--r-card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* 分类与操作条 */
.notice-tabs-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 0 16px;
  background: #fafbfc;
  flex-wrap: wrap;
  gap: 12px;
}
.tab-list {
  display: flex;
  gap: 6px;
}
.tab-btn {
  padding: 14px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s;
  user-select: none;
}
.tab-btn:hover { color: var(--primary); }
.tab-btn.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  background: #fff;
}
.tab-badge {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  background: #edf0f5;
  color: var(--text-2);
  font-weight: 700;
}
.tab-btn.active .tab-badge {
  background: rgba(31, 78, 121, 0.12);
  color: var(--primary);
}
.tab-badge.badge-red { background: var(--danger); color: #fff; }
.tab-badge.badge-orange { background: var(--warning); color: #fff; }

.filter-bar {
  padding: 14px 20px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
}

/* 通知列表 */
.notice-list {
  divide-y: 1px solid var(--line);
}
.notice-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  transition: all 0.15s;
  cursor: pointer;
  position: relative;
  background: #fff;
}
.notice-item:hover {
  background: #f7fafd;
}
.notice-item.unread {
  background: #fbfdff;
}
.notice-item.unread::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3.5px;
  background: var(--primary-2);
}
.notice-item.unread.urgent::before {
  background: var(--danger);
}
.notice-item.unread.warning::before {
  background: var(--warning);
}

/* 图标坞 */
.ni-icon-box {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex: none;
  background: #f0f4f9;
}
.ni-icon-box.todo { background: rgba(46, 117, 182, 0.12); color: var(--primary-2); }
.ni-icon-box.remind { background: rgba(123, 80, 160, 0.12); color: #7B50A0; }
.ni-icon-box.warn { background: rgba(245, 127, 23, 0.12); color: var(--warning); }
.ni-icon-box.danger { background: rgba(198, 40, 40, 0.12); color: var(--danger); }
.ni-icon-box.notice { background: rgba(46, 125, 50, 0.12); color: var(--success); }

/* 内容主体 */
.ni-body {
  flex: 1;
  min-width: 0;
}
.ni-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.ni-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
}
.notice-item.read .ni-title {
  color: var(--text-2);
  font-weight: 600;
}
.ni-desc {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 8px;
}
.ni-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--text-3);
  flex-wrap: wrap;
}
.ni-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* 右侧操作区 */
.ni-ops {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  min-width: 120px;
}
.ni-time {
  font-size: 12px;
  color: var(--text-3);
}
.ni-btn-group {
  display: flex;
  gap: 6px;
}

/* 抽屉详情 */
.drawer-mask {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.38);
  z-index: 210;
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 580px;
  background: #fff;
  box-shadow: -6px 0 24px rgba(0, 0, 0, 0.18);
  z-index: 220;
  display: flex;
  flex-direction: column;
  animation: drawerSlide 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes drawerSlide {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.drawer-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fafbfc;
}
.drawer-head h3 { font-size: 16px; font-weight: 700; color: var(--primary); }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
.drawer-foot {
  padding: 14px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fafbfc;
}

.detail-card {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 18px;
  margin: 16px 0;
  font-size: 13px;
  line-height: 1.8;
}
.detail-grid {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 8px 14px;
  font-size: 13px;
}
.detail-grid .k { color: var(--text-3); }

/* 空状态 */
.empty-box {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-3);
}
.empty-box .ei { font-size: 44px; margin-bottom: 12px; }
</style>
</head>
<body>

<main class="content">
  <!-- 面包屑与页头 -->
  <div class="page-head">
    <div>
      <div class="breadcrumb">教培系统 / 全局消息通知与协同待办中心</div>
      <h2 class="page-title">🔔 全局消息通知与协同待办中心</h2>
    </div>
    <div class="page-ops">
      <button class="btn btn-ghost" onclick="markAllAsRead()">✓ 全部标为已读</button>
      <button class="btn btn-ghost" onclick="resetNoticesDemo()">🔄 重置模拟通知</button>
      <button class="btn btn-primary" onclick="syncWithCurrentRole()">👤 切换当前角色视角</button>
    </div>
  </div>

  <!-- 顶部统计看板 -->
  <div class="stat-banner">
    <div class="stat-card" onclick="filterByTab('all')">
      <div class="sc-info">
        <div class="sc-title">全部通知总数</div>
        <div class="sc-num primary" id="statTotalCount">18</div>
      </div>
      <div class="sc-icon blue">📬</div>
    </div>
    <div class="stat-card" onclick="filterByTab('todo')">
      <div class="sc-info">
        <div class="sc-title">待办审批事项</div>
        <div class="sc-num danger" id="statTodoCount">6</div>
      </div>
      <div class="sc-icon red">📝</div>
    </div>
    <div class="stat-card" onclick="filterByTab('remind')">
      <div class="sc-info">
        <div class="sc-title">业务协同提醒</div>
        <div class="sc-num" id="statRemindCount">5</div>
      </div>
      <div class="sc-icon blue">🔔</div>
    </div>
    <div class="stat-card" onclick="filterByTab('warn')">
      <div class="sc-info">
        <div class="sc-title">风险安全预警</div>
        <div class="sc-num warning" id="statWarnCount">4</div>
      </div>
      <div class="sc-icon orange">⚠️</div>
    </div>
  </div>

  <!-- 通知主体容器 -->
  <div class="notice-box">
    <!-- 分类标签条 -->
    <div class="notice-tabs-bar">
      <div class="tab-list">
        <div class="tab-btn active" id="tab-all" onclick="switchCategory('all')">
          <span>全部通知</span><span class="tab-badge" id="tabBadgeAll">18</span>
        </div>
        <div class="tab-btn" id="tab-todo" onclick="switchCategory('todo')">
          <span>📋 待办审批</span><span class="tab-badge badge-red" id="tabBadgeTodo">6</span>
        </div>
        <div class="tab-btn" id="tab-remind" onclick="switchCategory('remind')">
          <span>🔔 业务提醒</span><span class="tab-badge" id="tabBadgeRemind">5</span>
        </div>
        <div class="tab-btn" id="tab-warn" onclick="switchCategory('warn')">
          <span>⚠️ 风险预警</span><span class="tab-badge badge-orange" id="tabBadgeWarn">4</span>
        </div>
        <div class="tab-btn" id="tab-notice" onclick="switchCategory('notice')">
          <span>📢 系统公告</span><span class="tab-badge" id="tabBadgeNotice">3</span>
        </div>
      </div>

      <div style="font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px">
        <span class="tag tag-blue" id="currentRoleTag">当前视角：三级管理员 (张三)</span>
      </div>
    </div>

    <!-- 筛选过滤操作栏 -->
    <div class="filter-bar">
      <div class="filter-item">
        <span>适用角色：</span>
        <select class="sel" id="roleFilter" onchange="renderNoticeList()" style="width:170px">
          <option value="ALL">全部角色 (全局总览)</option>
          <option value="办训人员">办训人员 · 张三</option>
          <option value="处领导">处领导 · 李处长</option>
          <option value="院领导">院领导 · 李院长</option>
          <option value="教研教师">教研教师 · 欧阳文华</option>
          <option value="安全保密管理员">安全保密管理员 · 陈保密</option>
          <option value="安全审计员">安全审计员 · 张审计</option>
          <option value="系统管理员">系统管理员 · 刘系统</option>
          <option value="财务管理员">财务管理员 · 冯处长</option>
        </select>
      </div>

      <div class="filter-item">
        <span>优先级：</span>
        <select class="sel" id="urgencyFilter" onchange="renderNoticeList()" style="width:130px">
          <option value="ALL">全部优先级</option>
          <option value="high">🔴 紧急优先</option>
          <option value="mid">🟠 重要事务</option>
          <option value="normal">🔵 常规通知</option>
        </select>
      </div>

      <div class="filter-item">
        <span>阅读状态：</span>
        <select class="sel" id="readFilter" onchange="renderNoticeList()" style="width:120px">
          <option value="ALL">全部状态</option>
          <option value="UNREAD">仅未读</option>
          <option value="READ">仅已读</option>
        </select>
      </div>

      <div class="filter-item" style="flex:1;min-width:240px">
        <input class="input" id="searchKeyword" placeholder="🔍 检索通知标题 / 关联班次 / 发起人 / 单号…" oninput="renderNoticeList()" style="width:100%">
      </div>

      <button class="btn btn-ghost btn-sm" onclick="clearFilters()">重置筛选</button>
    </div>

    <!-- 通知卡片列表 -->
    <div class="notice-list" id="noticeContainer"></div>
  </div>
</main>

<!-- 通知详情侧拉抽屉 -->
<div class="drawer-mask hidden" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer hidden" id="noticeDrawer">
  <div class="drawer-head">
    <h3 id="dwTypeTitle">📋 待办审批详情</h3>
    <span class="btn-text" onclick="closeDrawer()" style="font-size:16px">✕</span>
  </div>
  <div class="drawer-body" id="dwBody"></div>
  <div class="drawer-foot">
    <div style="font-size:12px;color:var(--text-3)" id="dwFootTime"></div>
    <div style="display:flex;gap:8px" id="dwFootBtns"></div>
  </div>
</div>

// 状态管理中心
// ==========================================
let NOTICES = [];
let currentCategory = 'all';

function initNotices() {
  const stored = localStorage.getItem('TREA_NOTICES_V1');
  if (stored) {
    try {
      NOTICES = JSON.parse(stored);
    } catch(e) {
      NOTICES = JSON.parse(JSON.stringify(DEFAULT_NOTICES));
    }
  } else {
    NOTICES = JSON.parse(JSON.stringify(DEFAULT_NOTICES));
    saveNotices();
  }
  updateStats();
  renderNoticeList();
}

function saveNotices() {
  localStorage.setItem('TREA_NOTICES_V1', JSON.stringify(NOTICES));
  updateStats();
  syncGlobalBadge();
}

function syncGlobalBadge() {
  const unreadCount = NOTICES.filter(n => !n.read).length;
  const badge = document.getElementById('topbarPendingBadge');
  if (badge) {
    badge.textContent = unreadCount;
    badge.style.display = unreadCount > 0 ? 'flex' : 'none';
  }
}

function updateStats() {
  const total = NOTICES.length;
  const unreadTodo = NOTICES.filter(n => n.type === 'todo' && !n.read).length;
  const unreadRemind = NOTICES.filter(n => n.type === 'remind' && !n.read).length;
  const unreadWarn = NOTICES.filter(n => n.type === 'warn' && !n.read).length;
  const unreadNotice = NOTICES.filter(n => n.type === 'notice' && !n.read).length;

  document.getElementById('statTotalCount').textContent = total;
  document.getElementById('statTodoCount').textContent = unreadTodo;
  document.getElementById('statRemindCount').textContent = unreadRemind;
  document.getElementById('statWarnCount').textContent = unreadWarn;

  document.getElementById('tabBadgeAll').textContent = total;
  document.getElementById('tabBadgeTodo').textContent = unreadTodo;
  document.getElementById('tabBadgeRemind').textContent = unreadRemind;
  document.getElementById('tabBadgeWarn').textContent = unreadWarn;
  document.getElementById('tabBadgeNotice').textContent = unreadNotice;
}

// 选项卡切换
function switchCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  const targetBtn = document.getElementById('tab-' + cat);
  if (targetBtn) targetBtn.classList.add('active');
  renderNoticeList();
}

function filterByTab(cat) {
  switchCategory(cat);
}

// 角色联动与筛选
function syncWithCurrentRole() {
  const curUser = window.TREA_STORE ? window.TREA_STORE.getCurrentUser() : { role: '三级管理员', name: '张三' };
  const roleSelect = document.getElementById('roleFilter');
  if (!roleSelect) return;

  let matchedVal = '办训人员';
  if (curUser.role.includes('处领导') || curUser.role.includes('二级')) matchedVal = '处领导';
  else if (curUser.role.includes('院领导') || curUser.role.includes('一级')) matchedVal = '院领导';
  else if (curUser.role.includes('教师') || curUser.role.includes('教授')) matchedVal = '教研教师';
  else if (curUser.role.includes('保密')) matchedVal = '安全保密管理员';
  else if (curUser.role.includes('审计')) matchedVal = '安全审计员';
  else if (curUser.role.includes('系统')) matchedVal = '系统管理员';

  roleSelect.value = matchedVal;
  document.getElementById('currentRoleTag').textContent = `当前视角：${curUser.role} (${curUser.name})`;
  renderNoticeList();
  toast(`已切换至当前登录角色「${curUser.role}」专属协同通知待办`, 'success');
}

function clearFilters() {
  document.getElementById('roleFilter').value = 'ALL';
  document.getElementById('urgencyFilter').value = 'ALL';
  document.getElementById('readFilter').value = 'ALL';
  document.getElementById('searchKeyword').value = '';
  switchCategory('all');
}

// 渲染通知卡片列表
function renderNoticeList() {
  const roleVal = document.getElementById('roleFilter').value;
  const urgencyVal = document.getElementById('urgencyFilter').value;
  const readVal = document.getElementById('readFilter').value;
  const kw = (document.getElementById('searchKeyword').value || '').trim().toLowerCase();

  const container = document.getElementById('noticeContainer');
  if (!container) return;

  const filtered = NOTICES.filter(n => {
    // 1. 分类 Tab 过滤
    if (currentCategory !== 'all' && n.type !== currentCategory) return false;

    // 2. 角色过滤
    if (roleVal !== 'ALL') {
      if (n.role !== '全体人员' && !n.role.includes(roleVal) && !roleVal.includes(n.role)) {
        return false;
      }
    }

    // 3. 优先级过滤
    if (urgencyVal !== 'ALL' && n.urgency !== urgencyVal) return false;

    // 4. 阅读状态
    if (readVal === 'UNREAD' && n.read) return false;
    if (readVal === 'READ' && !n.read) return false;

    // 5. 关键词检索
    if (kw) {
      const matchTitle = n.title.toLowerCase().includes(kw);
      const matchSummary = n.summary.toLowerCase().includes(kw);
      const matchSender = n.sender.toLowerCase().includes(kw);
      const matchRef = (n.refObj || '').toLowerCase().includes(kw);
      const matchMod = n.module.toLowerCase().includes(kw);
      if (!matchTitle && !matchSummary && !matchSender && !matchRef && !matchMod) return false;
    }

    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-box">
        <div class="ei">📭</div>
        <p style="font-size:14px;font-weight:600">暂无符合条件的通知与待办事项</p>
        <p style="font-size:12px;margin-top:4px">您可以尝试更换分类标签、重置角色条件或清空搜索关键词</p>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()" style="margin-top:12px">清空全部筛选</button>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(n => {
    const isUnread = !n.read;
    const urgencyClass = n.urgency === 'high' ? 'urgent' : (n.urgency === 'mid' ? 'warning' : '');
    
    // 图标和徽标定制
    let icon = '📝';
    let iconClass = 'todo';
    let typeName = '待办审批';
    let typeBadge = '<span class="tag tag-blue">待办审批</span>';
    if (n.type === 'remind') {
      icon = '🔔';
      iconClass = 'remind';
      typeName = '业务提醒';
      typeBadge = '<span class="tag tag-purple">业务提醒</span>';
    } else if (n.type === 'warn') {
      icon = '⚠️';
      iconClass = 'warn';
      typeName = '风险预警';
      typeBadge = '<span class="tag tag-orange">风险预警</span>';
    } else if (n.type === 'notice') {
      icon = '📢';
      iconClass = 'notice';
      typeName = '系统公告';
      typeBadge = '<span class="tag tag-green">系统公告</span>';
    }

    let urgencyBadge = '<span class="tag tag-gray">常规</span>';
    if (n.urgency === 'high') urgencyBadge = '<span class="tag tag-red">紧急优先</span>';
    else if (n.urgency === 'mid') urgencyBadge = '<span class="tag tag-orange">重要事务</span>';

    return `
      <div class="notice-item ${isUnread ? 'unread ' + urgencyClass : 'read'}" onclick="openNoticeDetail('${n.id}')">
        <div class="ni-icon-box ${iconClass}">
          ${icon}
        </div>
        <div class="ni-body">
          <div class="ni-head">
            ${urgencyBadge}
            ${typeBadge}
            <span class="tag tag-gray">${n.role}</span>
            <span class="ni-title">${n.title}</span>
            ${isUnread ? '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger)"></span>' : ''}
          </div>
          <div class="ni-desc">${n.summary}</div>
          <div class="ni-meta">
            <span>📂 业务模块：${n.module}</span>
            <span>👤 发起/来源：${n.sender}</span>
            <span>🔖 关联对象：${n.refObj || '系统'}</span>
            <span>🕒 ${n.timestamp}</span>
          </div>
        </div>
        <div class="ni-ops" onclick="event.stopPropagation()">
          <div class="ni-time">${n.time}</div>
          <div class="ni-btn-group">
            <button class="btn btn-sm ${isUnread ? 'btn-primary' : 'btn-ghost'}" onclick="handleNoticeAction('${n.id}', '${n.actionUrl}')">
              ${n.actionText}
            </button>
            ${isUnread ? `<button class="btn btn-ghost btn-sm" onclick="toggleRead('${n.id}', true)" title="标为已读">✓</button>` : `<button class="btn btn-ghost btn-sm" onclick="toggleRead('${n.id}', false)" title="标为未读">○</button>`}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// 标为已读/未读
function toggleRead(id, status) {
  const item = NOTICES.find(n => n.id === id);
  if (item) {
    item.read = status;
    saveNotices();
    renderNoticeList();
    toast(status ? '已标记为已读' : '已标记为未读', 'info');
  }
}

// 一键全部标为已读
function markAllAsRead() {
  NOTICES.forEach(n => n.read = true);
  saveNotices();
  renderNoticeList();
  toast('已全部标记为已读', 'success');
}

// 重置模拟通知
function resetNoticesDemo() {
  NOTICES = JSON.parse(JSON.stringify(DEFAULT_NOTICES));
  saveNotices();
  renderNoticeList();
  toast('模拟通知数据集已重置恢复！', 'success');
}

// 点击办理动作
function handleNoticeAction(id, url) {
  const item = NOTICES.find(n => n.id === id);
  if (item) {
    item.read = true;
    saveNotices();
  }
  if (url) {
    location.href = url;
  }
}

// 打开详情抽屉
function openNoticeDetail(id) {
  const n = NOTICES.find(x => x.id === id);
  if (!n) return;

  // 标为已读
  if (!n.read) {
    n.read = true;
    saveNotices();
    renderNoticeList();
  }

  let icon = '📝';
  if (n.type === 'remind') icon = '🔔';
  else if (n.type === 'warn') icon = '⚠️';
  else if (n.type === 'notice') icon = '📢';

  document.getElementById('dwTypeTitle').textContent = `${icon} ${n.title}`;

  let detailsHtml = '';
  if (n.details) {
    detailsHtml = `
      <div class="sec-title" style="margin-top:16px">📋 详细业务上下文指标</div>
      <div class="detail-card">
        <div class="detail-grid">
          ${Object.entries(n.details).map(([k, v]) => `
            <div class="k">${k}</div>
            <div class="v" style="font-weight:500;color:var(--text)">${v}</div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('dwBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <span class="tag ${n.urgency==='high'?'tag-red':(n.urgency==='mid'?'tag-orange':'tag-blue')}">${n.urgency==='high'?'紧急优先':(n.urgency==='mid'?'重要事务':'常规通知')}</span>
      <span class="tag tag-gray">${n.role}</span>
      <span class="tag tag-blue">${n.module}</span>
      <span style="font-size:12px;color:var(--text-3);margin-left:auto">${n.timestamp}</span>
    </div>

    <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--primary)">${n.title}</div>
    <div style="font-size:13.5px;color:var(--text-2);line-height:1.7;background:#fff;padding:14px;border-radius:var(--r);border:1px solid var(--line)">
      ${n.summary}
    </div>

    ${detailsHtml}

    <div style="margin-top:20px;padding:12px;background:#f0f5fa;border-radius:var(--r);font-size:12.5px;color:var(--text-2)">
      💡 <b>处理指引：</b>此通知由系统流转引擎自动化推送，点击下方操作按钮可直接下钻至相应业务模块开展审批、排障或归档作业。
    </div>
  `;

  document.getElementById('dwFootTime').textContent = `单号/编号：${n.refObj || '无'} · 来源：${n.sender}`;
  document.getElementById('dwFootBtns').innerHTML = `
    <button class="btn btn-ghost" onclick="closeDrawer()">关闭</button>
    <button class="btn btn-primary" onclick="handleNoticeAction('${n.id}', '${n.actionUrl}')">${n.actionText}</button>
  `;

  document.getElementById('drawerMask').classList.remove('hidden');
  document.getElementById('noticeDrawer').classList.remove('hidden');
}

function closeDrawer() {
  document.getElementById('drawerMask').classList.add('hidden');
  document.getElementById('noticeDrawer').classList.add('hidden');
}

// 页面加载自动初始化
document.addEventListener('DOMContentLoaded', () => {
  initNotices();

  // 若 URL 带特定参数，如 ?tab=todo，自动激活对应选项卡
  const p = new URLSearchParams(location.search);
  const tabParam = p.get('tab');
  if (tabParam && ['all', 'todo', 'remind', 'warn', 'notice'].includes(tabParam)) {
    switchCategory(tabParam);
  }
});
</script>
</body>
</html>
